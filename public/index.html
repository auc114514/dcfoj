<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dan_Chao_Fan OJ - 在线判题</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== 导航 ===== */
        .navbar {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #334155;
            padding: 0 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
            flex-wrap: wrap;
        }
        .nav-brand {
            font-size: 1.5rem;
            font-weight: 800;
            color: #38bdf8;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nav-brand::before {
            content: '⚡';
            font-size: 1.8rem;
        }
        .nav-links {
            display: flex;
            gap: 0.5rem;
            list-style: none;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: #94a3b8;
            text-decoration: none;
            font-weight: 500;
            padding: 0.4rem 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .nav-links a:hover,
        .nav-links a.active {
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
        }
        .version-badge {
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            color: white;
            padding: 0.2rem 0.7rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
        }
        .user-section {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.5rem 1.2rem;
            border: none;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.4);
        }
        .btn-secondary {
            background: #1e293b;
            color: #f1f5f9;
            border: 1px solid #334155;
        }
        .btn-secondary:hover {
            background: #334155;
        }

        /* ===== 主容器 ===== */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            flex: 1;
        }

        /* ===== 首页 ===== */
        .hero {
            text-align: center;
            padding: 4rem 2rem;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.08), rgba(129, 140, 248, 0.08));
            border-radius: 24px;
            border: 1px solid rgba(56, 189, 248, 0.15);
            margin-bottom: 3rem;
        }
        .hero h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero p {
            color: #94a3b8;
            font-size: 1.2rem;
            max-width: 600px;
            margin: 0 auto 1.5rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }
        .stat-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
            transition: transform 0.3s;
        }
        .stat-card:hover {
            transform: translateY(-4px);
        }
        .stat-number {
            font-size: 2.2rem;
            font-weight: 800;
            color: #38bdf8;
            display: block;
        }
        .stat-label {
            color: #94a3b8;
            margin-top: 0.3rem;
            font-size: 0.9rem;
        }

        .notice {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.08), rgba(251, 191, 36, 0.02));
            border: 1px solid rgba(251, 191, 36, 0.2);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        .notice-title {
            color: #fbbf24;
            font-weight: 700;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .footer {
            text-align: center;
            padding: 2rem;
            color: #64748b;
            border-top: 1px solid #334155;
            font-size: 0.85rem;
        }

        /* ===== 题库 ===== */
        .problem-table {
            width: 100%;
            border-collapse: collapse;
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #334155;
        }
        .problem-table th,
        .problem-table td {
            padding: 0.8rem 1.2rem;
            text-align: left;
            border-bottom: 1px solid #334155;
        }
        .problem-table th {
            background: rgba(56, 189, 248, 0.06);
            color: #38bdf8;
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
        }
        .problem-table tr:hover {
            background: rgba(56, 189, 248, 0.04);
        }
        .problem-table tr:last-child td {
            border-bottom: none;
        }

        .tag {
            display: inline-block;
            padding: 0.1rem 0.5rem;
            background: rgba(56, 189, 248, 0.12);
            color: #38bdf8;
            border-radius: 4px;
            font-size: 0.75rem;
            margin-right: 0.3rem;
        }
        .diff {
            display: inline-block;
            padding: 0.1rem 0.6rem;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 700;
        }
        .diff-easy {
            background: rgba(74, 222, 128, 0.2);
            color: #4ade80;
        }
        .diff-medium {
            background: rgba(251, 191, 36, 0.2);
            color: #fbbf24;
        }
        .diff-hard {
            background: rgba(248, 113, 113, 0.2);
            color: #f87171;
        }

        .status-solved {
            color: #4ade80;
            font-weight: 700;
        }
        .status-unsolved {
            color: #64748b;
        }

        .filters {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .filters input,
        .filters select {
            padding: 0.6rem 1rem;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #f1f5f9;
            outline: none;
            font-size: 0.9rem;
        }
        .filters input {
            flex: 1;
            min-width: 180px;
        }
        .filters select {
            min-width: 120px;
            cursor: pointer;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #64748b;
        }

        /* ===== 页面切换 ===== */
        .page {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .page.active {
            display: block;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .navbar {
                padding: 0.5rem 1rem;
                height: auto;
                gap: 0.5rem;
            }
            .nav-links a {
                padding: 0.3rem 0.6rem;
                font-size: 0.8rem;
            }
            .hero h1 {
                font-size: 2rem;
            }
            .hero {
                padding: 2rem 1rem;
            }
            .container {
                padding: 1rem;
            }
        }

        .type-badge {
            display: inline-block;
            padding: 0.1rem 0.5rem;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
            font-family: monospace;
        }
        .type-problem {
            background: rgba(56, 189, 248, 0.2);
            color: #38bdf8;
        }
        .type-team {
            background: rgba(167, 139, 250, 0.2);
            color: #a78bfa;
        }
        .type-user {
            background: rgba(251, 146, 60, 0.2);
            color: #fb923c;
        }
        .id-display {
            font-family: monospace;
            font-weight: 700;
        }
        .id-problem {
            color: #38bdf8;
        }
        .id-team {
            color: #a78bfa;
        }
        .id-user {
            color: #fb923c;
        }
    </style>
</head>
<body>

    <!-- 导航 -->
    <nav class="navbar">
        <span class="nav-brand" onclick="navigate('home')">Dan_Chao_Fan OJ</span>
        <ul class="nav-links">
            <li><a onclick="navigate('home')" id="nav-home" class="active">首页</a></li>
            <li><a onclick="navigate('problems')" id="nav-problems">题库</a></li>
            <li><a onclick="navigate('submissions')" id="nav-submissions">提交记录</a></li>
            <li><a onclick="navigate('about')" id="nav-about">关于</a></li>
        </ul>
        <div class="user-section">
            <span class="version-badge">v1.0.0</span>
            <span style="color:#94a3b8;font-size:0.9rem;" id="user-status">🧑‍💻 Guest</span>
        </div>
    </nav>

    <!-- 主容器 -->
    <div class="container" id="app"></div>

    <!-- 底部 -->
    <footer class="footer">
        <p>Dan_Chao_Fan OJ v1.0.0 | Built with ❤️</p>
    </footer>

    <!-- ============================================================ -->
    <script>
        // ================================================================
        //  配置
        // ================================================================
        const API_BASE = '/api';

        function apiCall(endpoint, options = {}) {
            return fetch(API_BASE + endpoint, {
                ...options,
                headers: { 'Content-Type': 'application/json', ...options.headers }
            }).then(r => r.json()).catch(() => ({ error: '网络错误' }));
        }

        // ================================================================
        //  页面路由
        // ================================================================
        const pages = {
            home: '首页',
            problems: '题库',
            submissions: '提交记录',
            about: '关于'
        };
        let currentPage = 'home';

        function navigate(page) {
            currentPage = page;
            location.hash = page;
            renderPage(page);
            document.querySelectorAll('.nav-links a').forEach(el => {
                el.classList.toggle('active', el.id === 'nav-' + page);
            });
        }

        function getRoute() {
            const hash = location.hash.slice(1) || 'home';
            return hash in pages ? hash : 'home';
        }

        // ================================================================
        //  渲染页面
        // ================================================================

        function renderPage(page) {
            const app = document.getElementById('app');
            switch (page) {
                case 'home':
                    renderHome(app);
                    break;
                case 'problems':
                    renderProblems(app);
                    break;
                case 'submissions':
                    renderSubmissions(app);
                    break;
                case 'about':
                    renderAbout(app);
                    break;
                default:
                    renderHome(app);
            }
        }

        // ----- 首页 -----
        async function renderHome(container) {
            const problems = await apiCall('/problems');
            const subs = await apiCall('/submissions');
            const ac = subs.filter(s => s.status === 'AC').length;

            container.innerHTML = `
                <div class="page active">
                    <div class="hero">
                        <h1>⚡ Dan_Chao_Fan OJ</h1>
                        <p>自主判题 · 实时评测 · 真·编译执行</p>
                        <button class="btn btn-primary" onclick="navigate('problems')">🚀 开始做题</button>
                    </div>
                    <div class="notice">
                        <div class="notice-title">📢 系统公告</div>
                        <p style="color:#94a3b8;">DCF OJ 已支持 C++ / Python / Java 真判题，数据存储在 Backblaze B2。</p>
                    </div>
                    <div class="stats-grid">
                        <div class="stat-card"><span class="stat-number">${problems.length}</span><div class="stat-label">题目</div></div>
                        <div class="stat-card"><span class="stat-number">${subs.length}</span><div class="stat-label">提交</div></div>
                        <div class="stat-card"><span class="stat-number">${ac}</span><div class="stat-label">通过</div></div>
                    </div>
                </div>
            `;
        }

        // ----- 题库 -----
        async function renderProblems(container) {
            const problems = await apiCall('/problems');
            const subs = await apiCall('/submissions');

            const typeMap = {
                problem: { label: '题库', cls: 'type-problem', idCls: 'id-problem' },
                team: { label: '团队', cls: 'type-team', idCls: 'id-team' },
                user: { label: '用户', cls: 'type-user', idCls: 'id-user' }
            };

            const diffMap = {
                easy: '入门',
                medium: '普及',
                hard: '提高'
            };

            let rows = problems.map(p => {
                const tc = typeMap[p.type] || typeMap.problem;
                const diff = diffMap[p.difficulty] || '未知';
                const ps = subs.filter(s => s.problem_code === p.code);
                const ac = ps.filter(s => s.status === 'AC').length;
                const rate = ps.length ? Math.floor(ac / ps.length * 100) : 0;

                return `
                    <tr>
                        <td><span class="status-unsolved">○</span></td>
                        <td class="id-display ${tc.idCls}">${p.code}</td>
                        <td style="font-weight:500;">${p.title}</td>
                        <td><span class="type-badge ${tc.cls}">${tc.label}</span></td>
                        <td><span class="diff diff-${p.difficulty || 'easy'}">${diff}</span></td>
                        <td>${rate}%</td>
                        <td>${(p.tags||[]).map(t => `<span class="tag">${t}</span>`).join('')}</td>
                    </tr>
                `;
            }).join('') || '<tr><td colspan="7" class="empty-state">暂无题目</td></tr>';

            container.innerHTML = `
                <div class="page active">
                    <h2 style="font-size:1.5rem;margin-bottom:1rem;">📚 题库</h2>
                    <div class="filters">
                        <input type="text" id="search-input" placeholder="搜索题目..." />
                        <select id="type-filter"><option value="all">全部类型</option><option value="problem">题库题</option><option value="team">团队题</option><option value="user">用户独创</option></select>
                    </div>
                    <table class="problem-table">
                        <thead><tr><th>状态</th><th>题号</th><th>名称</th><th>类型</th><th>难度</th><th>通过率</th><th>标签</th></tr></thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
            `;
        }

        // ----- 提交记录 -----
        async function renderSubmissions(container) {
            const subs = await apiCall('/submissions');
            let rows = subs.slice(0, 50).map(s => `
                <tr>
                    <td style="font-size:0.8rem;font-family:monospace;">${s.id || 'sub_'}</td>
                    <td>${s.username || 'Guest'}</td>
                    <td><span class="id-display">${s.problem_code}</span></td>
                    <td><span style="font-weight:700;color:${s.status === 'AC' ? '#4ade80' : '#f87171'}">${s.status}</span></td>
                    <td>${s.lang}</td>
                    <td>${s.time || 0}ms</td>
                    <td style="font-size:0.8rem;color:#64748b;">${s.timestamp ? new Date(s.timestamp).toLocaleString() : '-'}</td>
                </tr>
            `).join('') || '<tr><td colspan="7" class="empty-state">暂无提交</td></tr>';

            container.innerHTML = `
                <div class="page active">
                    <h2 style="font-size:1.5rem;margin-bottom:1rem;">📋 提交记录</h2>
                    <table class="problem-table">
                        <thead><tr><th>ID</th><th>用户</th><th>题目</th><th>状态</th><th>语言</th><th>耗时</th><th>时间</th></tr></thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
            `;
        }

        // ----- 关于 -----
        function renderAbout(container) {
            container.innerHTML = `
                <div class="page active">
                    <h2 style="font-size:1.8rem;margin-bottom:1.5rem;">关于 DCF OJ</h2>
                    <div style="background:#1e293b;border:1px solid #334155;border-radius:16px;padding:2rem;max-width:700px;">
                        <p><strong>Dan_Chao_Fan OJ</strong> v1.0.0</p>
                        <p style="color:#94a3b8;margin-top:0.5rem;">支持 C++14 / Python3 / Java 真判题</p>
                        <p style="color:#94a3b8;">数据存储: Backblaze B2</p>
                        <p style="color:#94a3b8;margin-top:0.5rem;font-size:0.85rem;">© 2026 Dan_Chao_Fan OJ Team</p>
                    </div>
                </div>
            `;
        }

        // ================================================================
        //  启动
        // ================================================================

        window.addEventListener('hashchange', () => {
            renderPage(getRoute());
        });

        window.addEventListener('load', () => {
            const route = getRoute();
            navigate(route);
        });

        // 暴露给 onclick
        window.navigate = navigate;
    </script>
</body>
</html>
