<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dan_Chao_Fan OJ - v1.1.3</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #38bdf8;
        }

        /* ===== 左侧导航 ===== */
        .app-layout {
            display: flex;
            flex: 1;
            min-height: calc(100vh - 60px);
        }
        .sidebar {
            width: 220px;
            background: #0f172a;
            border-right: 1px solid #334155;
            padding: 1.5rem 0;
            flex-shrink: 0;
            position: sticky;
            top: 60px;
            height: calc(100vh - 60px);
            overflow-y: auto;
        }
        .sidebar .nav-section {
            padding: 0 1rem;
            margin-bottom: 1.5rem;
        }
        .sidebar .nav-section .section-title {
            font-size: 0.65rem;
            text-transform: uppercase;
            color: #64748b;
            letter-spacing: 1px;
            padding: 0.3rem 0.5rem;
        }
        .sidebar .nav-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.85rem;
            text-decoration: none;
            margin: 0.1rem 0;
        }
        .sidebar .nav-item:hover {
            background: rgba(56, 189, 248, 0.08);
            color: #f1f5f9;
        }
        .sidebar .nav-item.active {
            background: rgba(56, 189, 248, 0.12);
            color: #38bdf8;
        }
        .sidebar .nav-item .icon {
            font-size: 1.1rem;
            width: 24px;
            text-align: center;
        }
        .sidebar .nav-item .badge {
            margin-left: auto;
            background: #334155;
            padding: 0.05rem 0.5rem;
            border-radius: 10px;
            font-size: 0.6rem;
            color: #94a3b8;
        }
        .sidebar .nav-divider {
            height: 1px;
            background: #334155;
            margin: 0.5rem 1rem;
        }
        .sidebar .user-profile-mini {
            padding: 0.8rem 1rem;
            border-bottom: 1px solid #334155;
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .sidebar .user-profile-mini .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            color: white;
            flex-shrink: 0;
        }
        .sidebar .user-profile-mini .uname {
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }
        .sidebar .user-profile-mini .uname:hover {
            color: #38bdf8;
        }
        .sidebar .user-profile-mini .urole {
            font-size: 0.6rem;
            color: #64748b;
        }

        .main-content {
            flex: 1;
            padding: 1.5rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .navbar {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #334155;
            padding: 0 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 60px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-brand {
            font-size: 1.2rem;
            font-weight: 800;
            color: #38bdf8;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nav-brand::before {
            content: '⚡';
        }
        .nav-top-right {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .version-badge {
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            color: white;
            padding: 0.1rem 0.5rem;
            border-radius: 12px;
            font-size: 0.6rem;
            font-weight: 700;
        }
        .gu-badge {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.1rem 0.4rem;
            border-radius: 10px;
        }
        .gu-gray {
            background: #64748b;
            color: white;
        }
        .gu-blue {
            background: #3b82f6;
            color: white;
        }
        .gu-green {
            background: #22c55e;
            color: white;
        }
        .gu-orange {
            background: #f97316;
            color: white;
        }
        .gu-red {
            background: #ef4444;
            color: white;
        }
        .gu-purple {
            background: #8b5cf6;
            color: white;
        }

        .btn {
            padding: 0.3rem 0.8rem;
            border: none;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.4);
        }
        .btn-secondary {
            background: #1e293b;
            color: #f1f5f9;
            border: 1px solid #334155;
        }
        .btn-secondary:hover {
            background: #334155;
        }
        .btn-danger {
            background: #ef4444;
            color: white;
        }
        .btn-danger:hover {
            background: #dc2626;
        }
        .btn-success {
            background: #22c55e;
            color: white;
        }
        .btn-success:hover {
            background: #16a34a;
        }
        .btn-sm {
            padding: 0.15rem 0.5rem;
            font-size: 0.7rem;
        }
        .btn-block {
            width: 100%;
            justify-content: center;
        }

        .page {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .page.active {
            display: block;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 1.2rem;
            margin-bottom: 0.8rem;
        }
        .card-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .hero {
            text-align: center;
            padding: 2.5rem 1.5rem;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.08), rgba(129, 140, 248, 0.08));
            border-radius: 16px;
            border: 1px solid rgba(56, 189, 248, 0.15);
            margin-bottom: 1.5rem;
        }
        .hero h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero p {
            color: #94a3b8;
            font-size: 1rem;
            margin: 0.3rem 0 1rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 0.8rem;
            margin-bottom: 1.5rem;
        }
        .stat-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 1rem;
            text-align: center;
        }
        .stat-number {
            font-size: 1.8rem;
            font-weight: 800;
            color: #38bdf8;
            display: block;
        }
        .stat-label {
            color: #94a3b8;
            font-size: 0.75rem;
        }

        .notice {
            background: rgba(251, 191, 36, 0.08);
            border: 1px solid rgba(251, 191, 36, 0.2);
            border-radius: 10px;
            padding: 0.8rem 1.2rem;
            margin-bottom: 1.2rem;
        }
        .notice-title {
            color: #fbbf24;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .table-wrap {
            overflow-x: auto;
        }
        .table {
            width: 100%;
            border-collapse: collapse;
            background: #1e293b;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #334155;
            font-size: 0.85rem;
        }
        .table th,
        .table td {
            padding: 0.5rem 0.8rem;
            text-align: left;
            border-bottom: 1px solid #334155;
        }
        .table th {
            background: rgba(56, 189, 248, 0.06);
            color: #38bdf8;
            font-weight: 600;
            font-size: 0.7rem;
            text-transform: uppercase;
        }
        .table tr:hover {
            background: rgba(56, 189, 248, 0.04);
        }
        .table tr:last-child td {
            border-bottom: none;
        }
        .table .clickable {
            cursor: pointer;
        }

        .tag {
            display: inline-block;
            padding: 0.05rem 0.4rem;
            background: rgba(56, 189, 248, 0.12);
            color: #38bdf8;
            border-radius: 4px;
            font-size: 0.65rem;
            margin-right: 0.2rem;
        }
        .diff {
            display: inline-block;
            padding: 0.05rem 0.4rem;
            border-radius: 8px;
            font-size: 0.6rem;
            font-weight: 700;
        }
        .diff-intro {
            background: rgba(248, 113, 113, 0.2);
            color: #f87171;
        }
        .diff-popular-minus {
            background: rgba(251, 146, 60, 0.2);
            color: #fb923c;
        }
        .diff-popular {
            background: rgba(250, 204, 21, 0.2);
            color: #facc15;
        }
        .diff-popular-plus {
            background: rgba(74, 222, 128, 0.2);
            color: #4ade80;
        }
        .diff-advanced {
            background: rgba(34, 211, 238, 0.2);
            color: #22d3ee;
        }
        .diff-advanced-plus {
            background: rgba(96, 165, 250, 0.2);
            color: #60a5fa;
        }
        .diff-provincial {
            background: rgba(167, 139, 250, 0.2);
            color: #a78bfa;
        }
        .diff-noi {
            background: rgba(156, 163, 175, 0.3);
            color: #e5e7eb;
        }
        .diff-noi-plus {
            background: rgba(244, 114, 182, 0.2);
            color: #f472b6;
        }

        .type-badge {
            display: inline-block;
            padding: 0.05rem 0.35rem;
            border-radius: 4px;
            font-size: 0.6rem;
            font-weight: 700;
            font-family: monospace;
        }
        .type-problem {
            background: rgba(56, 189, 248, 0.2);
            color: #38bdf8;
        }
        .type-team {
            background: rgba(167, 139, 250, 0.2);
            color: #a78bfa;
        }
        .type-user {
            background: rgba(251, 146, 60, 0.2);
            color: #fb923c;
        }

        .id-display {
            font-family: monospace;
            font-weight: 700;
        }
        .id-problem {
            color: #38bdf8;
        }
        .id-team {
            color: #a78bfa;
        }
        .id-user {
            color: #fb923c;
        }

        .filters {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.8rem;
            flex-wrap: wrap;
        }
        .filters input,
        .filters select {
            padding: 0.4rem 0.6rem;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #f1f5f9;
            outline: none;
            font-size: 0.8rem;
        }
        .filters input {
            flex: 1;
            min-width: 120px;
        }
        .filters select {
            min-width: 80px;
            cursor: pointer;
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: #64748b;
        }

        .footer {
            text-align: center;
            padding: 0.8rem;
            color: #64748b;
            border-top: 1px solid #334155;
            font-size: 0.7rem;
            margin-top: auto;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 1.5rem;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal h2 {
            text-align: center;
            margin-bottom: 0.8rem;
            font-size: 1.2rem;
        }
        .modal .form-group {
            margin-bottom: 0.6rem;
        }
        .modal .form-group label {
            display: block;
            color: #94a3b8;
            font-size: 0.8rem;
            margin-bottom: 0.1rem;
        }
        .modal .form-group input,
        .modal .form-group textarea,
        .modal .form-group select {
            width: 100%;
            padding: 0.4rem 0.6rem;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #f1f5f9;
            outline: none;
            font-size: 0.85rem;
            font-family: inherit;
        }
        .modal .form-group textarea {
            min-height: 60px;
            resize: vertical;
        }
        .modal-actions {
            display: flex;
            gap: 0.5rem;
            justify-content: flex-end;
            margin-top: 0.8rem;
        }

        .tweet-item {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 0.8rem 1rem;
            margin-bottom: 0.6rem;
        }
        .tweet-item .tweet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.2rem;
        }
        .tweet-item .tweet-user {
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .tweet-item .tweet-user:hover {
            text-decoration: underline;
        }
        .tweet-item .tweet-time {
            font-size: 0.65rem;
            color: #64748b;
        }
        .tweet-item .tweet-content {
            margin: 0.2rem 0;
            font-size: 0.9rem;
        }
        .tweet-item .tweet-code {
            background: #0f172a;
            padding: 0.4rem;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.75rem;
            overflow-x: auto;
            white-space: pre-wrap;
            margin: 0.2rem 0;
        }
        .tweet-item .tweet-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.2rem;
        }
        .tweet-item .tweet-actions button {
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            font-size: 0.7rem;
            padding: 0.05rem 0.2rem;
        }
        .tweet-item .tweet-actions button:hover {
            color: #38bdf8;
        }
        .tweet-reply {
            margin-left: 1.5rem;
            border-left: 2px solid #334155;
            padding-left: 0.8rem;
            margin-top: 0.3rem;
        }

        .gu-display {
            display: flex;
            gap: 0.3rem;
            align-items: center;
            flex-wrap: wrap;
        }
        .gu-item {
            background: #0f172a;
            padding: 0.1rem 0.5rem;
            border-radius: 4px;
            font-size: 0.7rem;
        }
        .gu-item .gu-label {
            color: #64748b;
        }
        .gu-item .gu-value {
            font-weight: 700;
        }

        .admin-stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 0.8rem;
            margin-bottom: 1rem;
        }

        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 0.8rem;
        }
        .team-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 0.8rem 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .team-card:hover {
            border-color: #38bdf8;
            transform: translateY(-2px);
        }
        .team-card h3 {
            color: #38bdf8;
            font-size: 1rem;
        }
        .team-card p {
            color: #94a3b8;
            font-size: 0.8rem;
        }
        .team-card .meta {
            color: #64748b;
            font-size: 0.65rem;
        }

        .ticket-item {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 0.8rem 1rem;
            margin-bottom: 0.6rem;
        }
        .ticket-status-open {
            background: rgba(251, 191, 36, 0.2);
            color: #fbbf24;
        }
        .ticket-status-closed {
            background: rgba(74, 222, 128, 0.2);
            color: #4ade80;
        }
        .ticket-status {
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.05rem 0.5rem;
            border-radius: 8px;
        }

        .admin-tag {
            background: #8b5cf6;
            color: white;
            padding: 0.05rem 0.4rem;
            border-radius: 8px;
            font-size: 0.6rem;
            font-weight: 700;
        }
        .cheater-tag {
            background: #b45309;
            color: white;
            padding: 0.05rem 0.4rem;
            border-radius: 8px;
            font-size: 0.6rem;
            font-weight: 700;
        }

        .username-admin {
            color: #c084fc !important;
        }
        .username-cheater {
            color: #b45309 !important;
        }
        .username-gray {
            color: #94a3b8 !important;
        }
        .username-blue {
            color: #60a5fa !important;
        }
        .username-green {
            color: #4ade80 !important;
        }
        .username-orange {
            color: #fb923c !important;
        }
        .username-red {
            color: #f87171 !important;
        }
        .username-purple {
            color: #a78bfa !important;
        }
        .username-brown {
            color: #b45309 !important;
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }
        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 700;
            color: white;
            flex-shrink: 0;
        }
        .profile-info h2 {
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }
        .profile-info .profile-role {
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.1rem 0.6rem;
            border-radius: 10px;
        }
        .profile-info .profile-role.admin {
            background: #8b5cf6;
            color: white;
        }
        .profile-info .profile-role.cheater {
            background: #b45309;
            color: white;
        }
        .profile-info .profile-role.user {
            background: #334155;
            color: #94a3b8;
        }
        .profile-info .profile-meta {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-top: 0.2rem;
        }

        .problem-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            height: calc(100vh - 200px);
            min-height: 500px;
        }
        .problem-panel {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 1rem;
            overflow-y: auto;
        }
        .problem-panel .problem-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 0.3rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .problem-panel .problem-meta {
            display: flex;
            gap: 0.8rem;
            color: #94a3b8;
            font-size: 0.8rem;
            flex-wrap: wrap;
            margin-bottom: 0.8rem;
        }
        .problem-panel .problem-content {
            font-size: 0.9rem;
            line-height: 1.7;
        }
        .problem-panel .problem-content h3 {
            color: #38bdf8;
            margin: 0.8rem 0 0.3rem;
            font-size: 1rem;
        }
        .problem-panel .problem-content pre {
            background: #0f172a;
            padding: 0.5rem;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 0.8rem;
        }
        .sample-io {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 0.6rem 0.8rem;
            margin: 0.5rem 0;
            font-family: monospace;
            font-size: 0.8rem;
        }
        .sample-io .label {
            color: #38bdf8;
            font-weight: 600;
            font-size: 0.7rem;
        }

        .editor-panel {
            display: flex;
            flex-direction: column;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            overflow: hidden;
        }
        .editor-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.3rem 0.8rem;
            background: #0f172a;
            border-bottom: 1px solid #334155;
            flex-wrap: wrap;
            gap: 0.3rem;
        }
        .editor-toolbar select {
            background: #1e293b;
            color: #f1f5f9;
            border: 1px solid #334155;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
            outline: none;

        <script>
        // ================================================================
        //  配置
        // ================================================================
        const API = '/api';
        let currentUser = null;
        let currentPage = 'home';
        let authMode = 'login';
        let replyTargetId = null;
        let reportTargetId = null;
        let currentTicketId = null;
        let currentProblemCode = null;
        let roleTargetUserId = null;
        let revokeTargetUserId = null;

        function apiCall(endpoint, opts = {}) {
            const token = localStorage.getItem('dcf_token');
            return fetch(API + endpoint, {
                ...opts,
                headers: {
                    'Content-Type': 'application/json',
                    ...(token ? { 'Authorization': 'Bearer ' + token } : {}),
                    ...opts.headers
                }
            }).then(r => r.json()).catch(() => ({ error: '网络错误' }));
        }

        function showToast(msg, type = 'info') {
            let el = document.getElementById('toast');
            if (!el) {
                el = document.createElement('div');
                el.id = 'toast';
                el.style.cssText =
                    'position:fixed;bottom:1.5rem;right:1.5rem;background:#1e293b;border:1px solid #334155;padding:0.6rem 1.2rem;border-radius:10px;z-index:9999;max-width:350px;transition:all 0.3s;transform:translateY(80px);opacity:0;font-size:0.9rem;';
                document.body.appendChild(el);
            }
            el.textContent = msg;
            el.style.color = type === 'error' ? '#ef4444' : type === 'success' ? '#4ade80' : '#f1f5f9';
            el.style.transform = 'translateY(0)';
            el.style.opacity = '1';
            clearTimeout(el._timer);
            el._timer = setTimeout(() => { el.style.transform = 'translateY(80px)';
                el.style.opacity = '0'; }, 3000);
        }

        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        // ================================================================
        //  用户名颜色
        // ================================================================
        function getUserColorClass(user) {
            if (!user) return 'username-gray';
            if (user.role === 'admin') return 'username-admin';
            if (user.role === 'cheater') return 'username-cheater';
            const gu = user.gu || { total: 0 };
            if (gu.total >= 210) return 'username-red';
            if (gu.total >= 160) return 'username-orange';
            if (gu.total >= 120) return 'username-green';
            if (gu.total >= 100) return 'username-blue';
            return 'username-gray';
        }

        function getUsernameHtml(user) {
            if (!user) return '<span class="username-gray">Guest</span>';
            const cls = getUserColorClass(user);
            const displayName = user.username || 'Unknown';
            return `<span class="${cls}" onclick="navigate('user','${displayName}')" style="cursor:pointer;">${displayName}</span>`;
        }

        // ================================================================
        //  认证
        // ================================================================
        function showLogin() { authMode = 'login';
            document.getElementById('auth-title').textContent = '登录';
            document.getElementById('auth-submit-btn').textContent = '登录';
            document.getElementById('auth-switch-text').innerHTML =
                '还没有账号？<a onclick="switchAuthMode()" style="color:#38bdf8;cursor:pointer;">注册</a>';
            document.getElementById('auth-username').value = '';
            document.getElementById('auth-password').value = '';
            document.getElementById('auth-captcha-group').style.display = 'none';
            document.getElementById('login-modal').classList.add('active');
            generateCaptcha(); }

        function showRegister() { authMode = 'register';
            document.getElementById('auth-title').textContent = '注册';
            document.getElementById('auth-submit-btn').textContent = '注册';
            document.getElementById('auth-switch-text').innerHTML =
                '已有账号？<a onclick="switchAuthMode()" style="color:#38bdf8;cursor:pointer;">去登录</a>';
            document.getElementById('auth-username').value = '';
            document.getElementById('auth-password').value = '';
            document.getElementById('auth-captcha-group').style.display = 'none';
            document.getElementById('login-modal').classList.add('active');
            generateCaptcha(); }

        function switchAuthMode() { if (authMode === 'login') showRegister();
            else showLogin(); }

        function generateCaptcha() {
            const a = Math.floor(Math.random() * 20) + 1,
                b = Math.floor(Math.random() * 20) + 1;
            document.getElementById('auth-captcha-text').textContent = a + ' + ' + b + ' = ?';
            document.getElementById('auth-captcha-text').dataset.answer = String(a + b);
        }

        async function handleAuth() {
            const username = document.getElementById('auth-username').value.trim();
            const password = document.getElementById('auth-password').value.trim();
            if (!username || !password) { showToast('请填写完整信息', 'error'); return; }

            const captchaGroup = document.getElementById('auth-captcha-group');
            if (captchaGroup.style.display !== 'none') {
                const input = document.getElementById('auth-captcha-input').value.trim();
                const answer = document.getElementById('auth-captcha-text').dataset.answer;
                if (input !== answer) { showToast('验证码错误', 'error');
                    generateCaptcha(); return; }
            }

            const res = await apiCall('/auth/' + authMode, { method: 'POST', body: JSON.stringify({ username,
                    password }) });
            if (res.error) { showToast(res.error, 'error'); if (authMode === 'login') { document.getElementById(
                        'auth-captcha-group').style.display = 'block';
                    generateCaptcha(); } return; }
            if (res.token) {
                localStorage.setItem('dcf_token', res.token);
                localStorage.setItem('dcf_user', JSON.stringify(res.user));
                currentUser = res.user;
                document.getElementById('login-modal').classList.remove('active');
                updateUI();
                showToast(authMode === 'login' ? '登录成功！' : '注册成功！', 'success');
                navigate('home');
            }
        }

        function logout() {
            localStorage.removeItem('dcf_token');
            localStorage.removeItem('dcf_user');
            currentUser = null;
            updateUI();
            showToast('已退出', 'warning');
            navigate('home');
        }

        function updateUI() {
            const token = localStorage.getItem('dcf_token');
            const userStr = localStorage.getItem('dcf_user');
            if (token && userStr) {
                try {
                    currentUser = JSON.parse(userStr);
                    document.getElementById('user-status').innerHTML = '👤 ' + currentUser.username;
                    document.getElementById('auth-btns').style.display = 'none';
                    document.getElementById('logout-btn').style.display = 'inline-block';

                    document.getElementById('gu-display-header').innerHTML =

                    // 侧边栏

                    avatar.textContent = currentUser.username.charAt(0).toUpperCase();
                    document.getElementById('sidebar-uname').textContent = currentUser.username;
                    document.getElementById('sidebar-uname').onclick = () => navigate('user', currentUser.username);
                    const roleMap = { admin: '管理员', cheater: '作弊者', user: '用户', banned: '已封禁' };

        // ================================================================
        //  路由
        // ================================================================
        function navigate(page, param) {
            currentPage = page;
            if (page === 'problem' && param === 'new') {
                location.hash = 'problem/new';
                renderProblemNew();
                return;
            }
            if (page === 'problem' && param && param.endsWith('/edit')) {
                const code = param.replace('/edit', '');
                location.hash = 'problem/' + param;
                renderProblemEdit(code);
                return;
            }
            if (page === 'problem' && param) {
                location.hash = 'problem/' + param;
                renderProblemDetail(param);
                return;
            }
            if (page === 'ticket' && param === 'new') {
                location.hash = 'ticket/new';
                renderTicketNew();
                return;
            }
            if (page === 'ticket' && param && param.endsWith('/edit')) {
                const id = param.replace('/edit', '');
                location.hash = 'ticket/' + param;
                renderTicketEdit(id);
                return;
            }
            if (page === 'ticket' && param) {
                location.hash = 'ticket/' + param;
                renderTicketDetail(param);
                return;
            }
            if (page === 'logs') {
                location.hash = 'logs';
                renderLogs();
                return;
            }
            if (page === 'user' && param) {
                location.hash = 'user/' + param;
                renderUserProfile(param);
                return;
            }
            if (param) location.hash = page + '/' + param;
            else location.hash = page;
            renderPage(page, param);
            updateSidebarActive(page);
        }

        function getRoute() {
            const hash = location.hash.slice(1) || 'home';
            const parts = hash.split('/');
            return { page: parts[0], param: parts[1] || null };
        }

        function updateSidebarActive(page) {
            document.querySelectorAll('.sidebar .nav-item').forEach(el => {
                el.classList.toggle('active', el.dataset.page === page);
            });
        }

        async function renderPage(page, param) {
            const app = document.getElementById('app');
            switch (page) {
                case 'home':
                    await renderHome(app);
                    break;
                case 'problems':
                    await renderProblems(app);
                    break;
                case 'submissions':
                    await renderSubmissions(app);
                    break;
                case 'tweets':
                    await renderTweets(app);
                    break;
                case 'user':
                    await renderUserProfile(param);
                    break;
                case 'teams':
                    await renderTeams(app);
                    break;
                case 'team':
                    await renderTeamDetail(app, param);
                    break;
                case 'tickets':
                    await renderTickets(app);
                    break;
                case 'versions':
                    await renderVersions(app);
                    break;
                case 'admin':
                    await renderAdmin(app);
                    break;
                default:
                    await renderHome(app);
            }
        }

        window.filterProblems = function() {

        function setupEditor() {
            const ed = document.getElementById('code-editor');
            const ln = document.getElementById('editor-lines');
            if (!ed) return;
            ed.addEventListener('input', updateLineNumbers);
            ed.addEventListener('scroll', () => { ln.scrollTop = ed.scrollTop; });
            ed.addEventListener('keydown', (e) => {
                if (e.key === 'Tab') {
                    e.preventDefault();
                    const s = ed.selectionStart,
                        end = ed.selectionEnd;
                    ed.value = ed.value.substring(0, s) + '    ' + ed.value.substring(end);
                    ed.selectionStart = ed.selectionEnd = s + 4;
                    updateLineNumbers();
                }
            });
        }

        function updateLineNumbers() {
            const ed = document.getElementById('code-editor');
            const ln = document.getElementById('editor-lines');
            if (!ed || !ln) return;
            ln.innerHTML = Array.from({ length: ed.value.split('\n').length }, (_, i) => i + 1).join('<br>');
        }

        function loadTemplate() {
            const lang = document.getElementById('code-lang')?.value || 'cpp';
            const templates = { cpp: '// C++14\n#include <iostream>\nusing namespace std;\n\nint main() {\n    // TODO\n    return 0;\n}',
                python: '# Python3\n# TODO', java: '// Java\nimport java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        // TODO\n    }\n}' };
            document.getElementById('code-editor').value = templates[lang] || '';
            updateLineNumbers();
        }

        async function saveNewProblem() {
            const code = document.getElementById('new-code').value.trim();
            const title = document.getElementById('new-title').value.trim();

            const reason = document.getElementById('new-reason').value.trim();

            try {
                const data = {

                    title,
                    difficulty: document.getElementById('new-difficulty').value,
                    type: document.getElementById('new-type').value,
                    timeLimit: parseInt(document.getElementById('new-time').value) || 1000,
                    memoryLimit: parseInt(document.getElementById('new-memory').value) || 128,
                    tags: document.getElementById('new-tags').value.split(',').map(s => s.trim()).filter(Boolean),
                    description,
                    testCases: JSON.parse(document.getElementById('new-testcases').value || '[]'),
                    dataPath: document.getElementById('new-datapath').value.trim() || code
                };

                const res = await apiCall('/problems', { method: 'POST', body: JSON.stringify(data) });

                await apiCall('/admin/log', {
                    method: 'POST',

                        action: '创建题目',
                        target_type: 'problem',
                        target_id: code,
                        target_name: title,
                        changes: data,
                        reason: reason || '创建新题目'
                    })

                navigate('problem', code);
            } catch (e) {
                showToast('JSON 格式错误: ' + e.message, 'error');
            }
        }

        async function showJudgeResult(subId) {
            const modal = document.getElementById('judge-modal');
            const grid = document.getElementById('judge-grid');
            const progress = document.getElementById('judge-progress');
            const info = document.getElementById('judge-info');
            const title = document.getElementById('judge-title');
            const closeBtn = document.getElementById('judge-close-btn');

            modal.classList.add('active');
            grid.innerHTML =
                '<div class="judge-block judge-judging" style="grid-column:1/-1;min-height:80px;">⏳ 评测中...</div>';
            progress.style.width = '0%';
            closeBtn.style.display = 'none';
            title.textContent = '⏳ 评测中...';

            let attempts = 0;
            const interval = setInterval(async () => {
                attempts++;
                const subs = await apiCall('/submissions');
                const sub = subs.find(s => s.id === subId);
                if (!sub || sub.status === 'PD' || sub.status === 'Judging') {
                    progress.style.width = Math.min(attempts * 5, 90) + '%';
                    info.textContent = attempts > 10 ? '评测中... 请稍候' : '编译中...';
                    return;
                }
                clearInterval(interval);
                progress.style.width = '100%';
                title.textContent = '✅ 评测完成';

                const statusMap = { AC: 'judge-AC', WA: 'judge-WA', TLE: 'judge-TLE', RE: 'judge-RE',
                    MLE: 'judge-MLE', OLE: 'judge-OLE', CE: 'judge-CE', UKE: 'judge-WA' };
                const statusLabels = { AC: '✅ AC', WA: '❌ WA', TLE: '⏰ TLE', RE: '💥 RE', MLE: '💾 MLE',
                    OLE: '📤 OLE', CE: '🔧 CE', UKE: '❓ UKE' };

                if (sub.results && sub.results.length) {
                    grid.innerHTML = sub.results.map(r =>
                        `<div class="judge-block ${statusMap[r.status]||'judge-WA'}">#${r.index}<br>${r.status}</div>`
                    ).join('');
                } else {
                    const cls = statusMap[sub.status] || 'judge-WA';
                    grid.innerHTML =
                        `<div class="judge-block ${cls}" style="grid-column:1/-1;min-height:60px;">${statusLabels[sub.status]||sub.status}</div>`;
                }

                info.textContent =
                    `总耗时: ${sub.time||0}ms | 内存: ${sub.memory||0}MB | 语言: ${sub.lang||'C++'}`;
                closeBtn.style.display = 'inline-block';
                document.getElementById('judge-close-btn').onclick = () => closeModal('judge-modal');
            }, 600);
        }

            if (!title || !content) { showToast('请填写完整信息', 'error'); return; }
            const res = await apiCall('/tickets', { method: 'POST', body: JSON.stringify({ title, content }) });
            if (res.error) { showToast(res.error, 'error'); return; }
            showToast('工单提交成功！', 'success');
            navigate('ticket', res.id);
        }

        async function renderTicketDetail(id) {
            const tickets = await apiCall('/tickets');
            const ticket = tickets.find(t => t.id === id);
            if (!ticket) { navigate('tickets'); return; }
            const app = document.getElementById('app');
            const isAdmin = currentUser?.role === 'admin';

            app.innerHTML = `
                <div class="page active">
                    <button class="btn btn-secondary btn-sm" onclick="navigate('tickets')">← 返回</button>
                    <div class="card" style="margin-top:0.5rem;">
                        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.5rem;">
                            <h2 style="font-size:1.3rem;">📩 ${ticket.title}</h2>
                            <span class="ticket-status ${ticket.status==='open'?'ticket-status-open':'ticket-status-closed'}">${ticket.status==='open'?'待处理':'已关闭'}</span>
                        </div>
                        <p style="color:#94a3b8;margin:0.5rem 0;white-space:pre-wrap;">${ticket.content}</p>
                        <div style="font-size:0.7rem;color:#64748b;">提交于 ${new Date(ticket.created_at).toLocaleString()}</div>
                        ${ticket.admin_reply ? `<div style="background:#0f172a;padding:0.5rem;border-radius:6px;margin-top:0.5rem;border-left:3px solid #38bdf8;"><strong style="color:#38bdf8;">管理员回复：</strong>${ticket.admin_reply}</div>` : ''}
                        ${isAdmin && ticket.status === 'open' ? `<button class="btn btn-primary btn-sm" style="margin-top:0.5rem;" onclick="navigate('ticket','${id}/edit')">✏️ 回复</button>` : ''}
                    </div>
                </div>
            `;
        }

        async function renderTicketEdit(id) {
            if (!currentUser || currentUser.role !== 'admin') {
                showToast('需要管理员权限', 'error');
                navigate('ticket', id);
                return;
            }
            const tickets = await apiCall('/tickets');
            const ticket = tickets.find(t => t.id === id);
            if (!ticket) { navigate('tickets'); return; }
            const app = document.getElementById('app');

            app.innerHTML = `
                <div class="page active">
                    <button class="btn btn-secondary btn-sm" onclick="navigate('ticket','${id}')">← 返回</button>
                    <div class="card" style="margin-top:0.5rem;">
                        <h2 style="font-size:1.3rem;">✏️ 回复工单 #${id}</h2>
                        <div style="background:#0f172a;padding:0.5rem;border-radius:6px;margin-bottom:0.8rem;">
                            <strong>${ticket.title}</strong>
                            <p style="color:#94a3b8;font-size:0.9rem;">${ticket.content}</p>
                        </div>
                        <div class="edit-form">
                            <div class="form-group"><label>回复内容 *</label><textarea id="ticket-reply-content" rows="4" placeholder="输入回复内容..."></textarea></div>
                            <div class="form-group"><label>状态</label>
                                <select id="ticket-reply-status">
                                    <option value="open">保持开启</option>
                                    <option value="closed">关闭工单</option>
                                </select>
                            </div>
                            <div class="form-actions">
                                <button class="btn btn-secondary" onclick="navigate('ticket','${id}')">取消</button>
                                <button class="btn btn-primary" onclick="submitTicketReply('${id}')">✅ 提交</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        async function submitTicketReply(id) {
            const reply = document.getElementById('ticket-reply-content').value.trim();
            const status = document.getElementById('ticket-reply-status').value;
            if (!reply) { showToast('请填写回复内容', 'error'); return; }
            const res = await apiCall('/tickets/' + id, { method: 'PUT', body: JSON.stringify({ admin_reply: reply,
                    status }) });
            if (res.error) { showToast(res.error, 'error'); return; }
            showToast('回复成功！', 'success');
            navigate('ticket', id);
        }

        // ================================================================
        //  版本日志
        // ================================================================
        async function renderVersions(container) {
            const versions = await apiCall('/versions');

            let items = versions.map(v => `
                <div class="card">
                    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.3rem;">
                        <h3 style="color:#38bdf8;font-size:1.1rem;">${v.version}</h3>
                        <span style="color:#64748b;font-size:0.7rem;">${new Date(v.created_at).toLocaleDateString()}</span>
                    </div>
                    <h4 style="margin:0.2rem 0;font-size:0.95rem;">${v.title}</h4>
                    <p style="color:#94a3b8;font-size:0.85rem;">${v.content}</p>
                </div>
            `).join('') || '<div class="empty-state">暂无版本记录</div>';

            container.innerHTML = `
                <div class="page active">
                    <h2 style="font-size:1.3rem;margin-bottom:0.8rem;">📜 版本日志</h2>
                    ${items}
                </div>
            `;
        }

        // ================================================================
        //  陶片放逐
        // ================================================================
        async function renderLogs() {
            const app = document.getElementById('app');
            if (!currentUser || currentUser.role !== 'admin') {
                app.innerHTML = `<div class="page active"><div class="empty-state">🔒 需要管理员权限</div></div>`;
                return;
            }
            const logs = await apiCall('/admin/logs');

            let items = logs.map(l => `
                <div class="card log-entry">
                    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.3rem;">
                        <span><span class="log-admin">${l.admin_name}</span> <span class="log-action">${l.action}</span></span>
                        <span class="log-time">${new Date(l.created_at).toLocaleString()}</span>
                    </div>
                    <div class="log-target">
                        目标: ${l.target_type} <span class="id-display">${l.target_id}</span> (${l.target_name}) ${l.target_uid ? 'UID:'+l.target_uid : ''}
                    </div>
                    ${l.changes ? `<div class="log-changes">${JSON.stringify(l.changes)}</div>` : ''}
                    ${l.reason ? `<div class="log-reason">📌 ${l.reason}</div>` : ''}
                </div>
            `).join('') || '<div class="empty-state">暂无日志</div>';

            app.innerHTML = `
                <div class="page active">
                    <h2 style="font-size:1.3rem;margin-bottom:0.8rem;">📜 陶片放逐 · 管理员日志</h2>
                    ${items}
                </div>
            `;
        }

        // ================================================================
        //  管理员
        // ================================================================
        async function renderAdmin(container) {
    if (!currentUser || currentUser.role !== 'admin') {
        container.innerHTML =
            `<div class="page active"><div class="empty-state">🔒 需要管理员权限</div></div>`;
        return;
    }
    const stats = await apiCall('/admin/stats');
    const users = await apiCall('/users');

    container.innerHTML = `
        <div class="page active">
            <h2 style="font-size:1.3rem;margin-bottom:0.8rem;">🛡️ 管理面板</h2>
            <div class="admin-stats-grid">
                <div class="stat-card"><span class="stat-number">${stats.users||0}</span><div class="stat-label">用户</div></div>
                <div class="stat-card"><span class="stat-number">${stats.problems||0}</span><div class="stat-label">题目</div></div>
                <div class="stat-card"><span class="stat-number">${stats.submissions||0}</span><div class="stat-label">提交</div></div>
                <div class="stat-card"><span class="stat-number">${stats.openTickets||0}</span><div class="stat-label">工单</div></div>
            </div>
            <div class="card">
                <div class="card-title">👥 用户</div>
                <div class="table-wrap">
                    <table class="table">
                        <thead><tr><th>UID</th><th>用户名</th><th>角色</th><th>已解决</th><th>操作</th></tr></thead>
                        <tbody>
                            ${users.map(u => {
                                const nameHtml = getUsernameHtml(u);
                                const roleMap = { admin: '管理员', cheater: '作弊者', user: '用户', banned: '已封禁' };
                                return `
                                <tr>
                                    <td style="font-family:monospace;font-size:0.8rem;">${u.uid}</td>
                                    <td>${nameHtml}</td>
                                    <td>${roleMap[u.role]||'用户'}</td>
                                    <td>${(u.solved||[]).length}</td>
                                    <td>
                                        <button class="btn btn-secondary btn-sm" onclick="showRoleModal('${u.id}','${u.username}')">🏷️ 改角色</button>
                                        <button class="btn btn-danger btn-sm" onclick="showRevokeModal('${u.id}','${u.username}')">🔽 撤销</button>
                                        ${u.role !== 'admin' && u.username !== 'Dan_Chao_Fan' ? `<button class="btn btn-danger btn-sm" onclick="banUser('${u.id}')">封禁</button>` : ''}
                                    </td>
                                </tr>
                            `}).join('')}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    `;
}

        async function banUser(id) {
            if (!confirm('确认封禁该用户？')) return;
            const res = await apiCall('/admin/users/' + id + '/ban', { method: 'PUT' });
            if (res.error) { showToast(res.error, 'error'); return; }
            showToast('用户已封禁', 'success');
            navigate('admin');
        }

        // ================================================================
        //  启动
        // ================================================================
        window.addEventListener('hashchange', () => {
            const route = getRoute();
            if (route.page === 'problem' && route.param) {
                if (route.param === 'new') { renderProblemNew(); return; }
                if (route.param.endsWith('/edit')) { renderProblemEdit(route.param.replace('/edit', '')); return; }
                renderProblemDetail(route.param);
                return;
            }
            if (route.page === 'ticket' && route.param) {
                if (route.param === 'new') { renderTicketNew(); return; }
                if (route.param.endsWith('/edit')) { renderTicketEdit(route.param.replace('/edit', '')); return; }
                renderTicketDetail(route.param);
                return;
            }
            if (route.page === 'logs') { renderLogs(); return; }
            if (route.page === 'user' && route.param) { renderUserProfile(route.param); return; }
            renderPage(route.page, route.param);
            updateSidebarActive(route.page);
        });

        window.addEventListener('load', () => {
            updateUI();
            const route = getRoute();
            if (route.page === 'problem' && route.param) {
                if (route.param === 'new') { renderProblemNew(); return; }
                if (route.param.endsWith('/edit')) { renderProblemEdit(route.param.replace('/edit', '')); return; }
                renderProblemDetail(route.param);
                return;
            }
            if (route.page === 'ticket' && route.param) {
                if (route.param === 'new') { renderTicketNew(); return; }
                if (route.param.endsWith('/edit')) { renderTicketEdit(route.param.replace('/edit', '')); return; }
                renderTicketDetail(route.param);
                return;
            }
            if (route.page === 'logs') { renderLogs(); return; }
            if (route.page === 'user' && route.param) { renderUserProfile(route.param); return; }
            navigate(route.page, route.param);
        });

        // 暴露全局
        window.navigate = navigate;
        window.showLogin = showLogin;
        window.showRegister = showRegister;
        window.switchAuthMode = switchAuthMode;
        window.handleAuth = handleAuth;
        window.logout = logout;
        window.postTweet = postTweet;
        window.showReply = showReply;
        window.submitReply = submitReply;
        window.showReport = showReport;
        window.submitReport = submitReport;
        window.createTeam = createTeam;
        window.joinTeam = joinTeam;
        window.submitTicket = submitTicket;
        window.adminReplyTicket = adminReplyTicket;
        window.replyTicket = replyTicket;
        window.banUser = banUser;
        window.closeModal = closeModal;
        window.filterProblems = filterProblems;
        window.submitCode = submitCode;
        window.loadTemplate = loadTemplate;
        window.resetCode = resetCode;
        window.saveProblemEdit = saveProblemEdit;
        window.deleteProblem = deleteProblem;
        window.showRoleModal = showRoleModal;
        window.saveUserRole = saveUserRole;
        window.showRevokeModal = showRevokeModal;
        window.confirmRevoke = confirmRevoke;
        window.renderUserProfile = renderUserProfile;
        window.toggleSidebar = toggleSidebar;
        window.renderTicketNew = renderTicketNew;
        window.submitNewTicket = submitNewTicket;
        window.renderTicketDetail = renderTicketDetail;
        window.renderTicketEdit = renderTicketEdit;
        window.submitTicketReply = submitTicketReply;
    </script>
</body>
</html>
