<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dan_Chao_Fan OJ - v1.1.0</title>
    <style>
        /* ===== 全局 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #38bdf8;
        }

        /* ===== 导航 ===== */
        .navbar {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #334155;
            padding: 0 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 60px;
            flex-wrap: wrap;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-brand {
            font-size: 1.3rem;
            font-weight: 800;
            color: #38bdf8;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nav-brand::before {
            content: '⚡';
        }
        .nav-links {
            display: flex;
            gap: 0.2rem;
            list-style: none;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: #94a3b8;
            text-decoration: none;
            font-weight: 500;
            padding: 0.3rem 0.7rem;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .nav-links a:hover,
        .nav-links a.active {
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
        }
        .version-badge {
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            color: white;
            padding: 0.1rem 0.5rem;
            border-radius: 12px;
            font-size: 0.6rem;
            font-weight: 700;
        }
        .user-section {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            flex-wrap: wrap;
        }
        .gu-badge {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.1rem 0.4rem;
            border-radius: 10px;
        }
        .gu-gray {
            background: #64748b;
            color: white;
        }
        .gu-blue {
            background: #3b82f6;
            color: white;
        }
        .gu-green {
            background: #22c55e;
            color: white;
        }
        .gu-orange {
            background: #f97316;
            color: white;
        }
        .gu-red {
            background: #ef4444;
            color: white;
        }
        .gu-purple {
            background: #8b5cf6;
            color: white;
        }

        .btn {
            padding: 0.3rem 0.8rem;
            border: none;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.4);
        }
        .btn-secondary {
            background: #1e293b;
            color: #f1f5f9;
            border: 1px solid #334155;
        }
        .btn-secondary:hover {
            background: #334155;
        }
        .btn-danger {
            background: #ef4444;
            color: white;
        }
        .btn-danger:hover {
            background: #dc2626;
        }
        .btn-success {
            background: #22c55e;
            color: white;
        }
        .btn-success:hover {
            background: #16a34a;
        }
        .btn-sm {
            padding: 0.15rem 0.5rem;
            font-size: 0.7rem;
        }
        .btn-block {
            width: 100%;
            justify-content: center;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem;
            flex: 1;
            width: 100%;
        }

        .page {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .page.active {
            display: block;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 1.2rem;
            margin-bottom: 0.8rem;
        }
        .card-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .hero {
            text-align: center;
            padding: 2.5rem 1.5rem;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.08), rgba(129, 140, 248, 0.08));
            border-radius: 16px;
            border: 1px solid rgba(56, 189, 248, 0.15);
            margin-bottom: 1.5rem;
        }
        .hero h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero p {
            color: #94a3b8;
            font-size: 1rem;
            margin: 0.3rem 0 1rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 0.8rem;
            margin-bottom: 1.5rem;
        }
        .stat-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 1rem;
            text-align: center;
        }
        .stat-number {
            font-size: 1.8rem;
            font-weight: 800;
            color: #38bdf8;
            display: block;
        }
        .stat-label {
            color: #94a3b8;
            font-size: 0.75rem;
        }

        .notice {
            background: rgba(251, 191, 36, 0.08);
            border: 1px solid rgba(251, 191, 36, 0.2);
            border-radius: 10px;
            padding: 0.8rem 1.2rem;
            margin-bottom: 1.2rem;
        }
        .notice-title {
            color: #fbbf24;
            font-weight: 600;
            font-size: 0.9rem;
        }

        /* ===== 表格 ===== */
        .table-wrap {
            overflow-x: auto;
        }
        .table {
            width: 100%;
            border-collapse: collapse;
            background: #1e293b;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #334155;
            font-size: 0.85rem;
        }
        .table th,
        .table td {
            padding: 0.5rem 0.8rem;
            text-align: left;
            border-bottom: 1px solid #334155;
        }
        .table th {
            background: rgba(56, 189, 248, 0.06);
            color: #38bdf8;
            font-weight: 600;
            font-size: 0.7rem;
            text-transform: uppercase;
        }
        .table tr:hover {
            background: rgba(56, 189, 248, 0.04);
        }
        .table tr:last-child td {
            border-bottom: none;
        }
        .table .clickable {
            cursor: pointer;
        }

        .tag {
            display: inline-block;
            padding: 0.05rem 0.4rem;
            background: rgba(56, 189, 248, 0.12);
            color: #38bdf8;
            border-radius: 4px;
            font-size: 0.65rem;
            margin-right: 0.2rem;
        }
        .diff {
            display: inline-block;
            padding: 0.05rem 0.4rem;
            border-radius: 8px;
            font-size: 0.6rem;
            font-weight: 700;
        }
        .diff-intro {
            background: rgba(248, 113, 113, 0.2);
            color: #f87171;
        }
        .diff-popular-minus {
            background: rgba(251, 146, 60, 0.2);
            color: #fb923c;
        }
        .diff-popular {
            background: rgba(250, 204, 21, 0.2);
            color: #facc15;
        }
        .diff-popular-plus {
            background: rgba(74, 222, 128, 0.2);
            color: #4ade80;
        }
        .diff-advanced {
            background: rgba(34, 211, 238, 0.2);
            color: #22d3ee;
        }
        .diff-advanced-plus {
            background: rgba(96, 165, 250, 0.2);
            color: #60a5fa;
        }
        .diff-provincial {
            background: rgba(167, 139, 250, 0.2);
            color: #a78bfa;
        }
        .diff-noi {
            background: rgba(156, 163, 175, 0.3);
            color: #e5e7eb;
        }
        .diff-noi-plus {
            background: rgba(244, 114, 182, 0.2);
            color: #f472b6;
        }

        .type-badge {
            display: inline-block;
            padding: 0.05rem 0.35rem;
            border-radius: 4px;
            font-size: 0.6rem;
            font-weight: 700;
            font-family: monospace;
        }
        .type-problem {
            background: rgba(56, 189, 248, 0.2);
            color: #38bdf8;
        }
        .type-team {
            background: rgba(167, 139, 250, 0.2);
            color: #a78bfa;
        }
        .type-user {
            background: rgba(251, 146, 60, 0.2);
            color: #fb923c;
        }

        .id-display {
            font-family: monospace;
            font-weight: 700;
        }
        .id-problem {
            color: #38bdf8;
        }
        .id-team {
            color: #a78bfa;
        }
        .id-user {
            color: #fb923c;
        }

        .filters {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.8rem;
            flex-wrap: wrap;
        }
        .filters input,
        .filters select {
            padding: 0.4rem 0.6rem;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #f1f5f9;
            outline: none;
            font-size: 0.8rem;
        }
        .filters input {
            flex: 1;
            min-width: 120px;
        }
        .filters select {
            min-width: 80px;
            cursor: pointer;
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: #64748b;
        }

        .footer {
            text-align: center;
            padding: 1rem;
            color: #64748b;
            border-top: 1px solid #334155;
            font-size: 0.75rem;
        }

        /* ===== 模态框 ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 1.5rem;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal h2 {
            text-align: center;
            margin-bottom: 0.8rem;
            font-size: 1.2rem;
        }
        .modal .form-group {
            margin-bottom: 0.6rem;
        }
        .modal .form-group label {
            display: block;
            color: #94a3b8;
            font-size: 0.8rem;
            margin-bottom: 0.1rem;
        }
        .modal .form-group input,
        .modal .form-group textarea,
        .modal .form-group select {
            width: 100%;
            padding: 0.4rem 0.6rem;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #f1f5f9;
            outline: none;
            font-size: 0.85rem;
            font-family: inherit;
        }
        .modal .form-group textarea {
            min-height: 60px;
            resize: vertical;
        }
        .modal-actions {
            display: flex;
            gap: 0.5rem;
            justify-content: flex-end;
            margin-top: 0.8rem;
        }

        /* ===== 犇犇 ===== */
        .tweet-item {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 0.8rem 1rem;
            margin-bottom: 0.6rem;
        }
        .tweet-item .tweet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.2rem;
        }
        .tweet-item .tweet-user {
            font-weight: 600;
            color: #38bdf8;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .tweet-item .tweet-time {
            font-size: 0.65rem;
            color: #64748b;
        }
        .tweet-item .tweet-content {
            margin: 0.2rem 0;
            font-size: 0.9rem;
        }
        .tweet-item .tweet-code {
            background: #0f172a;
            padding: 0.4rem;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.75rem;
            overflow-x: auto;
            white-space: pre-wrap;
            margin: 0.2rem 0;
        }
        .tweet-item .tweet-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.2rem;
        }
        .tweet-item .tweet-actions button {
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            font-size: 0.7rem;
            padding: 0.05rem 0.2rem;
        }
        .tweet-item .tweet-actions button:hover {
            color: #38bdf8;
        }
        .tweet-reply {
            margin-left: 1.5rem;
            border-left: 2px solid #334155;
            padding-left: 0.8rem;
            margin-top: 0.3rem;
        }

        .gu-display {
            display: flex;
            gap: 0.3rem;
            align-items: center;
            flex-wrap: wrap;
        }
        .gu-item {
            background: #0f172a;
            padding: 0.1rem 0.5rem;
            border-radius: 4px;
            font-size: 0.7rem;
        }
        .gu-item .gu-label {
            color: #64748b;
        }
        .gu-item .gu-value {
            font-weight: 700;
        }

        .admin-stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 0.8rem;
            margin-bottom: 1rem;
        }

        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 0.8rem;
        }
        .team-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 0.8rem 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .team-card:hover {
            border-color: #38bdf8;
            transform: translateY(-2px);
        }
        .team-card h3 {
            color: #38bdf8;
            font-size: 1rem;
        }
        .team-card p {
            color: #94a3b8;
            font-size: 0.8rem;
        }
        .team-card .meta {
            color: #64748b;
            font-size: 0.65rem;
        }

        .ticket-item {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 0.8rem 1rem;
            margin-bottom: 0.6rem;
        }
        .ticket-status-open {
            background: rgba(251, 191, 36, 0.2);
            color: #fbbf24;
        }
        .ticket-status-closed {
            background: rgba(74, 222, 128, 0.2);
            color: #4ade80;
        }
        .ticket-status {
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.05rem 0.5rem;
            border-radius: 8px;
        }

        .admin-tag {
            background: #8b5cf6;
            color: white;
            padding: 0.05rem 0.4rem;
            border-radius: 8px;
            font-size: 0.6rem;
            font-weight: 700;
        }

        /* ===== 题目详情 ===== */
        .problem-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            height: calc(100vh - 200px);
            min-height: 500px;
        }
        .problem-panel {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 1rem;
            overflow-y: auto;
        }
        .problem-panel .problem-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 0.3rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .problem-panel .problem-meta {
            display: flex;
            gap: 0.8rem;
            color: #94a3b8;
            font-size: 0.8rem;
            flex-wrap: wrap;
            margin-bottom: 0.8rem;
        }
        .problem-panel .problem-content {
            font-size: 0.9rem;
            line-height: 1.7;
        }
        .problem-panel .problem-content h3 {
            color: #38bdf8;
            margin: 0.8rem 0 0.3rem;
            font-size: 1rem;
        }
        .problem-panel .problem-content pre {
            background: #0f172a;
            padding: 0.5rem;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 0.8rem;
        }
        .sample-io {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 0.6rem 0.8rem;
            margin: 0.5rem 0;
            font-family: monospace;
            font-size: 0.8rem;
        }
        .sample-io .label {
            color: #38bdf8;
            font-weight: 600;
            font-size: 0.7rem;
        }

        .editor-panel {
            display: flex;
            flex-direction: column;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            overflow: hidden;
        }
        .editor-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.3rem 0.8rem;
            background: #0f172a;
            border-bottom: 1px solid #334155;
            flex-wrap: wrap;
            gap: 0.3rem;
        }
        .editor-toolbar select {
            background: #1e293b;
            color: #f1f5f9;
            border: 1px solid #334155;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
            outline: none;
        }
        .editor-wrapper {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
        }
        .editor-line-numbers {
            background: #0f172a;
            color: #64748b;
            padding: 0.5rem 0.3rem;
            font-family: monospace;
            font-size: 0.75rem;
            line-height: 1.6;
            text-align: right;
            user-select: none;
            min-width: 30px;
            border-right: 1px solid #334155;
            overflow: hidden;
        }
        .editor-textarea {
            flex: 1;
            background: #0f172a;
            color: #f1f5f9;
            border: none;
            padding: 0.5rem 0.8rem;
            font-family: monospace;
            font-size: 0.75rem;
            line-height: 1.6;
            resize: none;
            outline: none;
            tab-size: 4;
        }
        .editor-actions {
            display: flex;
            gap: 0.5rem;
            padding: 0.4rem 0.8rem;
            background: #0f172a;
            border-top: 1px solid #334155;
            align-items: center;
            flex-wrap: wrap;
        }
        .cooldown-hint {
            color: #fbbf24;
            font-size: 0.7rem;
            display: none;
            align-items: center;
            gap: 0.3rem;
        }
        .cooldown-hint.active {
            display: flex;
        }

        /* ===== 判题结果 ===== */
        .judge-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 0.4rem;
            margin-top: 0.5rem;
            max-height: 200px;
            overflow-y: auto;
        }
        .judge-block {
            aspect-ratio: 1;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: monospace;
            font-size: 0.7rem;
            font-weight: 700;
            border: 2px solid transparent;
            transition: all 0.3s;
            min-height: 60px;
        }
        .judge-block:hover {
            transform: scale(1.05);
        }
        .judge-AC {
            background: #22c55e;
            color: white;
        }
        .judge-WA {
            background: #ef4444;
            color: white;
        }
        .judge-TLE {
            background: #1f1f1f;
            color: white;
            border-color: #434343;
        }
        .judge-RE {
            background: #8b5cf6;
            color: white;
        }
        .judge-MLE {
            background: #1f1f1f;
            color: white;
            border-color: #434343;
        }
        .judge-OLE {
            background: #1f1f1f;
            color: white;
            border-color: #434343;
        }
        .judge-CE {
            background: #f59e0b;
            color: #1f1f1f;
        }
        .judge-PD {
            background: #64748b;
            color: white;
            opacity: 0.6;
        }
        .judge-judging {
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            color: white;
            animation: pulse 1.2s infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.7;
                transform: scale(0.97);
            }
        }
        .judge-progress {
            width: 100%;
            height: 4px;
            background: #1e293b;
            border-radius: 2px;
            overflow: hidden;
            margin: 0.3rem 0;
        }
        .judge-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            border-radius: 2px;
            transition: width 0.3s;
            width: 0%;
        }

        /* ===== 编辑页面 ===== */
        .edit-form .form-group {
            margin-bottom: 0.8rem;
        }
        .edit-form .form-group label {
            display: block;
            color: #94a3b8;
            font-size: 0.8rem;
            margin-bottom: 0.2rem;
        }
        .edit-form .form-group input,
        .edit-form .form-group textarea,
        .edit-form .form-group select {
            width: 100%;
            padding: 0.4rem 0.6rem;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;

</head>

    <!-- ===== 模态框 ===== -->

            <div class="form-group"><label>密码</label><input type="password" id="auth-password" placeholder="密码" /></div>
            <div id="auth-captcha-group" style="display:none;">
                <div class="form-group">
                    <label>验证码</label>
                    <div style="display:flex;gap:0.5rem;align-items:center;">
                        <span id="auth-captcha-text" style="background:#0f172a;padding:0.2rem 0.8rem;border-radius:6px;font-weight:700;font-family:monospace;font-size:0.9rem;">3+5=?</span>
                        <input type="text" id="auth-captcha-input" placeholder="答案" style="flex:1;padding:0.3rem 0.6rem;background:#0f172a;border:1px solid #334155;border-radius:6px;color:#f1f5f9;outline:none;font-size:0.85rem;" />

            <div class="form-group"><label>语言</label>

    <div class="modal-overlay" id="judge-modal">
        <div class="modal" style="max-width:600px;">
            <h2 id="judge-title">⏳ 评测中...</h2>
            <div class="judge-progress"><div class="judge-progress-fill" id="judge-progress"></div></div>
            <p id="judge-info" style="color:#94a3b8;font-size:0.8rem;text-align:center;">正在编译...</p>
            <div class="judge-grid" id="judge-grid"></div>
            <div class="modal-actions" style="justify-content:center;">

            </div>
        </div>
    </div>

    <script>
        // ================================================================
        //  配置
        // ================================================================
        const API = '/api';
        let currentUser = null;
        let currentPage = 'home';
        let authMode = 'login';
        let replyTargetId = null;
        let reportTargetId = null;
        let currentTicketId = null;
        let currentProblemCode = null;

        function apiCall(endpoint, opts = {}) {
            const token = localStorage.getItem('dcf_token');
            return fetch(API + endpoint, {
                ...opts,
                headers: {
                    'Content-Type': 'application/json',
                    ...(token ? { 'Authorization': 'Bearer ' + token } : {}),
                    ...opts.headers
                }
            }).then(r => r.json()).catch(() => ({ error: '网络错误' }));
        }

        function showToast(msg, type = 'info') {
            let el = document.getElementById('toast');
            if (!el) {
                el = document.createElement('div');
                el.id = 'toast';
                el.style.cssText =
                    'position:fixed;bottom:1.5rem;right:1.5rem;background:#1e293b;border:1px solid #334155;padding:0.6rem 1.2rem;border-radius:10px;z-index:9999;max-width:350px;transition:all 0.3s;transform:translateY(80px);opacity:0;font-size:0.9rem;';
                document.body.appendChild(el);
            }
            el.textContent = msg;
            el.style.color = type === 'error' ? '#ef4444' : type === 'success' ? '#4ade80' : '#f1f5f9';
            el.style.transform = 'translateY(0)';
            el.style.opacity = '1';
            clearTimeout(el._timer);
            el._timer = setTimeout(() => { el.style.transform = 'translateY(80px)';
                el.style.opacity = '0'; }, 3000);
        }

        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        // ================================================================
        //  认证
        // ================================================================
        function showLogin() { authMode = 'login';
            document.getElementById('auth-title').textContent = '登录';
            document.getElementById('auth-submit-btn').textContent = '登录';
            document.getElementById('auth-switch-text').innerHTML =
                '还没有账号？<a onclick="switchAuthMode()" style="color:#38bdf8;cursor:pointer;">注册</a>';
            document.getElementById('auth-username').value = '';
            document.getElementById('auth-password').value = '';
            document.getElementById('auth-captcha-group').style.display = 'none';
            document.getElementById('login-modal').classList.add('active');
            generateCaptcha(); }

        function showRegister() { authMode = 'register';
            document.getElementById('auth-title').textContent = '注册';
            document.getElementById('auth-submit-btn').textContent = '注册';
            document.getElementById('auth-switch-text').innerHTML =
                '已有账号？<a onclick="switchAuthMode()" style="color:#38bdf8;cursor:pointer;">去登录</a>';
            document.getElementById('auth-username').value = '';
            document.getElementById('auth-password').value = '';
            document.getElementById('auth-captcha-group').style.display = 'none';
            document.getElementById('login-modal').classList.add('active');
            generateCaptcha(); }

        function switchAuthMode() { if (authMode === 'login') showRegister();
            else showLogin(); }

        function generateCaptcha() {
            const a = Math.floor(Math.random() * 20) + 1,
                b = Math.floor(Math.random() * 20) + 1;
            document.getElementById('auth-captcha-text').textContent = a + ' + ' + b + ' = ?';
            document.getElementById('auth-captcha-text').dataset.answer = String(a + b);
        }

        async function handleAuth() {
            const username = document.getElementById('auth-username').value.trim();
            const password = document.getElementById('auth-password').value.trim();
            if (!username || !password) { showToast('请填写完整信息', 'error'); return; }

            const captchaGroup = document.getElementById('auth-captcha-group');
            if (captchaGroup.style.display !== 'none') {
                const input = document.getElementById('auth-captcha-input').value.trim();
                const answer = document.getElementById('auth-captcha-text').dataset.answer;
                if (input !== answer) { showToast('验证码错误', 'error');
                    generateCaptcha(); return; }
            }

            const res = await apiCall('/auth/' + authMode, { method: 'POST', body: JSON.stringify({ username,
                    password }) });
            if (res.error) { showToast(res.error, 'error'); if (authMode === 'login') { document.getElementById(
                        'auth-captcha-group').style.display = 'block';
                    generateCaptcha(); } return; }
            if (res.token) {
                localStorage.setItem('dcf_token', res.token);
                localStorage.setItem('dcf_user', JSON.stringify(res.user));
                currentUser = res.user;
                document.getElementById('login-modal').classList.remove('active');
                updateUI();
                showToast(authMode === 'login' ? '登录成功！' : '注册成功！', 'success');
                navigate('home');
            }
        }

        function logout() {
            localStorage.removeItem('dcf_token');
            localStorage.removeItem('dcf_user');
            currentUser = null;
            updateUI();
            showToast('已退出', 'warning');
            navigate('home');
        }

        function updateUI() {
            const token = localStorage.getItem('dcf_token');
            const userStr = localStorage.getItem('dcf_user');
            if (token && userStr) {
                try {
                    currentUser = JSON.parse(userStr);
                    document.getElementById('user-status').innerHTML = '👤 ' + currentUser.username;
                    document.getElementById('auth-btns').style.display = 'none';
                    document.getElementById('logout-btn').style.display = 'inline-block';
                    const gu = currentUser.gu || { total: 0, color: 'gray' };
                    const colorMap = { gray: 'gu-gray', blue: 'gu-blue', green: 'gu-green', orange: 'gu-orange',
                        red: 'gu-red', purple: 'gu-purple' };
                    document.getElementById('gu-display-header').innerHTML =
                        `<span class="gu-badge ${colorMap[gu.color]||'gu-gray'}">${Math.floor(gu.total)}</span>`;
                    if (currentUser.role === 'admin') document.getElementById('nav-admin-li').style.display =
                        'inline-block';
                    else document.getElementById('nav-admin-li').style.display = 'none';
                } catch { resetUI(); }
            } else { resetUI(); }
        }

        function resetUI() {
            currentUser = null;
            document.getElementById('user-status').innerHTML = '🧑 Guest';
            document.getElementById('auth-btns').style.display = 'flex';
            document.getElementById('logout-btn').style.display = 'none';
            document.getElementById('gu-display-header').innerHTML = '';
            document.getElementById('nav-admin-li').style.display = 'none';
        }

        // ================================================================
        //  路由
        // ================================================================
        function navigate(page, param) {
            currentPage = page;
            if (page === 'problem' && param) {
                // 检测是否是编辑页面
                if (param.endsWith('/edit')) {
                    const code = param.replace('/edit', '');
                    location.hash = 'problem/' + param;
                    renderProblemEdit(code);
                    return;
                }
                location.hash = 'problem/' + param;
                renderProblemDetail(param);
                return;
            }
            if (param) location.hash = page + '/' + param;
            else location.hash = page;
            renderPage(page, param);
            document.querySelectorAll('.nav-links a').forEach(el => {
                el.classList.toggle('active', el.id === 'nav-' + page);
            });
        }

        function getRoute() {
            const hash = location.hash.slice(1) || 'home';
            const parts = hash.split('/');
            return { page: parts[0], param: parts[1] || null };
        }

        async function renderPage(page, param) {
            const app = document.getElementById('app');
            switch (page) {
                case 'home':
                    await renderHome(app);
                    break;
                case 'problems':
                    await renderProblems(app);
                    break;
                case 'problem':
                    // 在 navigate 里已经处理了，这里不再重复
                    break;
                case 'submissions':
                    await renderSubmissions(app);
                    break;
                case 'tweets':
                    await renderTweets(app);
                    break;
                case 'user':
                    await renderUserProfile(app, param);
                    break;
                case 'teams':
                    await renderTeams(app);
                    break;
                case 'team':
                    await renderTeamDetail(app, param);
                    break;
                case 'tickets':
                    await renderTickets(app);
                    break;
                case 'versions':
                    await renderVersions(app);
                    break;
                case 'admin':
                    await renderAdmin(app);
                    break;
                default:
                    await renderHome(app);
            }
        }

        // ================================================================
        //  首页
        // ================================================================
        async function renderHome(container) {
            const problems = await apiCall('/problems');
            const subs = await apiCall('/submissions');
            const ac = subs.filter(s => s.status === 'AC').length;

            container.innerHTML = `
                <div class="page active">
                    <div class="hero">
                        <h1>⚡ Dan_Chao_Fan OJ</h1>
                        <p>真判题 · 咕值 · 犇犇 · 团队 · 工单</p>
                        <button class="btn btn-primary" onclick="navigate('problems')">🚀 开始做题</button>
                    </div>
                    <div class="notice">
                        <div class="notice-title">📢 v1.1.0 大更新</div>
                        <p style="color:#94a3b8;font-size:0.9rem;">犇犇、用户主页、团队系统、咕值系统、工单系统、管理员面板</p>
                    </div>
                    <div class="stats-grid">
                        <div class="stat-card"><span class="stat-number">${problems.length}</span><div class="stat-label">题目</div></div>
                        <div class="stat-card"><span class="stat-number">${subs.length}</span><div class="stat-label">提交</div></div>
                        <div class="stat-card"><span class="stat-number">${ac}</span><div class="stat-label">通过</div></div>
                    </div>
                </div>
            `;
        }

        // ================================================================
        //  题库
        // ================================================================
        async function renderProblems(container) {
            const problems = await apiCall('/problems');
            const subs = await apiCall('/submissions');

            const diffMap = { intro: '入门', 'popular-minus': '普及-', popular: '普及', 'popular-plus': '普及+/提高-',
                advanced: '提高', 'advanced-plus': '提高+/省选-', provincial: '省选/NOI-', noi: 'NOI', 'noi-plus': 'NOI+' };
            const typeMap = { problem: { label: '题库', cls: 'type-problem', idCls: 'id-problem' },
                team: { label: '团队', cls: 'type-team', idCls: 'id-team' },
                user: { label: '用户', cls: 'type-user', idCls: 'id-user' } };

            let rows = problems.map(p => {
                const tc = typeMap[p.type] || typeMap.problem;
                const diff = diffMap[p.difficulty] || '未知';
                const ps = subs.filter(s => s.problem_code === p.code);
                const ac = ps.filter(s => s.status === 'AC').length;
                const rate = ps.length ? Math.floor(ac / ps.length * 100) : 0;
                return `<tr class="clickable" onclick="navigate('problem','${p.code}')">
                    <td><span style="color:#64748b;">○</span></td>
                    <td class="id-display ${tc.idCls}">${p.code}</td>
                    <td>${p.title}</td>
                    <td><span class="type-badge ${tc.cls}">${tc.label}</span></td>
                    <td><span class="diff diff-${p.difficulty}">${diff}</span></td>
                    <td>${rate}%</td>
                    <td>${(p.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}</td>
                </tr>`;
            }).join('') || '<tr><td colspan="7" class="empty-state">暂无题目</td></tr>';

            container.innerHTML = `
                <div class="page active">
                    <h2 style="font-size:1.3rem;margin-bottom:0.8rem;">📚 题库</h2>
                    <div class="filters">
                        <input type="text" id="search-input" placeholder="搜索..." oninput="filterProblems()" />
                        <select id="type-filter" onchange="filterProblems()"><option value="all">全部</option><option value="problem">题库</option><option value="team">团队</option><option value="user">用户</option></select>
                    </div>
                    <div class="table-wrap">
                        <table class="table">
                            <thead><tr><th>状态</th><th>题号</th><th>名称</th><th>类型</th><th>难度</th><th>通过率</th><th>标签</th></tr></thead>
                            <tbody id="problem-tbody">${rows}</tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        window.filterProblems = function() {
            const search = document.getElementById('search-input')?.value?.toLowerCase() || '';
            const type = document.getElementById('type-filter')?.value || 'all';
            const rows = document.querySelectorAll('#problem-tbody tr');
            rows.forEach(row => {
                const text = row.textContent.toLowerCase();
                const typeMatch = type === 'all' || text.includes(type);
                const searchMatch = text.includes(search);
                row.style.display = (typeMatch && searchMatch) ? '' : 'none';
            });
        };

        // ================================================================
        //  题目详情
        // ================================================================
        async function renderProblemDetail(code) {
            if (!code) { navigate('problems'); return; }
            const problems = await apiCall('/problems');
            const p = problems.find(x => x.code === code);
            if (!p) { navigate('problems'); return; }
            currentProblemCode = code;
            const app = document.getElementById('app');

            const diffMap = { intro: '入门', 'popular-minus': '普及-', popular: '普及', 'popular-plus': '普及+/提高-',
                advanced: '提高', 'advanced-plus': '提高+/省选-', provincial: '省选/NOI-', noi: 'NOI', 'noi-plus': 'NOI+' };
            const typeMap = { problem: { label: '题库', cls: 'type-problem', idCls: 'id-problem' },
                team: { label: '团队', cls: 'type-team', idCls: 'id-team' },
                user: { label: '用户', cls: 'type-user', idCls: 'id-user' } };
            const tc = typeMap[p.type] || typeMap.problem;
            const diff = diffMap[p.difficulty] || '未知';
            const isAdmin = currentUser?.role === 'admin';

            app.innerHTML = `
                <div class="page active">
                    <button class="btn btn-secondary btn-sm" onclick="navigate('problems')">← 返回题库</button>

        function setupEditor() {
            const ed = document.getElementById('code-editor');
            const ln = document.getElementById('editor-lines');
            if (!ed) return;
            ed.addEventListener('input', updateLineNumbers);
            ed.addEventListener('scroll', () => { ln.scrollTop = ed.scrollTop; });
            ed.addEventListener('keydown', (e) => {
                if (e.key === 'Tab') {
                    e.preventDefault();
                    const s = ed.selectionStart,
                        end = ed.selectionEnd;
                    ed.value = ed.value.substring(0, s) + '    ' + ed.value.substring(end);
                    ed.selectionStart = ed.selectionEnd = s + 4;
                    updateLineNumbers();
                }
            });
        }

        function updateLineNumbers() {
            const ed = document.getElementById('code-editor');
            const ln = document.getElementById('editor-lines');
            if (!ed || !ln) return;
            ln.innerHTML = Array.from({ length: ed.value.split('\n').length }, (_, i) => i + 1).join('<br>');
        }

        function loadTemplate() {
            const lang = document.getElementById('code-lang')?.value || 'cpp';
            const templates = { cpp: '// C++14\n#include <iostream>\nusing namespace std;\n\nint main() {\n    // TODO\n    return 0;\n}',
                python: '# Python3\n# TODO', java: '// Java\nimport java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        // TODO\n    }\n}' };
            document.getElementById('code-editor').value = templates[lang] || '';
            updateLineNumbers();
        }

        function resetCode() { loadTemplate(); }

        async function showJudgeResult(subId) {
            const modal = document.getElementById('judge-modal');
            const grid = document.getElementById('judge-grid');
            const progress = document.getElementById('judge-progress');
            const info = document.getElementById('judge-info');
            const title = document.getElementById('judge-title');
            const closeBtn = document.getElementById('judge-close-btn');

            modal.classList.add('active');
            grid.innerHTML =
                '<div class="judge-block judge-judging" style="grid-column:1/-1;min-height:80px;">⏳ 评测中...</div>';
            progress.style.width = '0%';
            closeBtn.style.display = 'none';
            title.textContent = '⏳ 评测中...';

            let attempts = 0;
            const interval = setInterval(async () => {
                attempts++;
                const subs = await apiCall('/submissions');
                const sub = subs.find(s => s.id === subId);
                if (!sub || sub.status === 'PD' || sub.status === 'Judging') {
                    progress.style.width = Math.min(attempts * 5, 90) + '%';
                    info.textContent = attempts > 10 ? '评测中... 请稍候' : '编译中...';
                    return;
                }
                clearInterval(interval);
                progress.style.width = '100%';
                title.textContent = '✅ 评测完成';

                const statusMap = { AC: 'judge-AC', WA: 'judge-WA', TLE: 'judge-TLE', RE: 'judge-RE',
                    MLE: 'judge-MLE', OLE: 'judge-OLE', CE: 'judge-CE', UKE: 'judge-WA' };
                const statusLabels = { AC: '✅ AC', WA: '❌ WA', TLE: '⏰ TLE', RE: '💥 RE', MLE: '💾 MLE',
                    OLE: '📤 OLE', CE: '🔧 CE', UKE: '❓ UKE' };

                if (sub.results && sub.results.length) {
                    grid.innerHTML = sub.results.map(r =>
                        `<div class="judge-block ${statusMap[r.status]||'judge-WA'}">#${r.index}<br>${r.status}</div>`
                    ).join('');
                } else {
                    const cls = statusMap[sub.status] || 'judge-WA';
                    grid.innerHTML =
                        `<div class="judge-block ${cls}" style="grid-column:1/-1;min-height:60px;">${statusLabels[sub.status]||sub.status}</div>`;
                }

                info.textContent =
                    `总耗时: ${sub.time||0}ms | 内存: ${sub.memory||0}MB | 语言: ${sub.lang||'C++'}`;
                closeBtn.style.display = 'inline-block';
                document.getElementById('judge-close-btn').onclick = () => closeModal('judge-modal');
            }, 600);
        }

                    </div>
                    <p style="color:#94a3b8;font-size:0.85rem;margin:0.2rem 0;">${t.content}</p>
                    ${t.admin_reply ? `<div style="background:#0f172a;padding:0.4rem;border-radius:6px;margin-top:0.2rem;border-left:3px solid #38bdf8;font-size:0.85rem;"><strong style="color:#38bdf8;">管理员:</strong> ${t.admin_reply}</div>` : ''}
                    <div style="font-size:0.65rem;color:#64748b;margin-top:0.2rem;">${new Date(t.created_at).toLocaleString()}</div>
                    ${currentUser && currentUser.role === 'admin' && t.status === 'open' ? `<button class="btn btn-primary btn-sm" onclick="adminReplyTicket(${t.id})">回复</button>` : ''}
                </div>
            `).join('') || '<div class="empty-state">暂无工单</div>';

            container.innerHTML = `
                <div class="page active">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.8rem;flex-wrap:wrap;gap:0.5rem;">
                        <h2 style="font-size:1.3rem;">📩 工单</h2>
                        ${currentUser ? `<button class="btn btn-primary btn-sm" onclick="document.getElementById('ticket-modal').classList.add('active')">✏️ 提交</button>` : ''}
                    </div>
                    ${items}
                </div>
            `;
        }

        async function submitTicket() {
            const title = document.getElementById('ticket-title').value.trim();
            const content = document.getElementById('ticket-content').value.trim();
            if (!title || !content) { showToast('请填写完整', 'error'); return; }
            const res = await apiCall('/tickets', { method: 'POST', body: JSON.stringify({ title, content }) });
            if (res.error) { showToast(res.error, 'error'); return; }
            showToast('工单提交成功！', 'success');
            document.getElementById('ticket-modal').classList.remove('active');
            navigate('tickets');
        }

        function adminReplyTicket(id) { currentTicketId = id;
            document.getElementById('admin-ticket-reply').value = '';
            document.getElementById('admin-ticket-modal').classList.add('active'); }

        async function replyTicket() {
            const reply = document.getElementById('admin-ticket-reply').value.trim();
            const status = document.getElementById('admin-ticket-status').value;
            if (!reply) { showToast('请填写回复内容', 'error'); return; }
            const res = await apiCall('/tickets/' + currentTicketId, { method: 'PUT', body: JSON.stringify({ admin_reply: reply,
                    status }) });
            if (res.error) { showToast(res.error, 'error'); return; }
            showToast('回复成功！', 'success');
            document.getElementById('admin-ticket-modal').classList.remove('active');
            navigate('tickets');
        }

        // ================================================================
        //  版本日志
        // ================================================================
        async function renderVersions(container) {
            const versions = await apiCall('/versions');

            let items = versions.map(v => `
                <div class="card">
                    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.3rem;">
                        <h3 style="color:#38bdf8;font-size:1.1rem;">${v.version}</h3>
                        <span style="color:#64748b;font-size:0.7rem;">${new Date(v.created_at).toLocaleDateString()}</span>
                    </div>
                    <h4 style="margin:0.2rem 0;font-size:0.95rem;">${v.title}</h4>
                    <p style="color:#94a3b8;font-size:0.85rem;">${v.content}</p>
                </div>
            `).join('') || '<div class="empty-state">暂无版本记录</div>';

            container.innerHTML = `
                <div class="page active">
                    <h2 style="font-size:1.3rem;margin-bottom:0.8rem;">📜 版本日志</h2>
                    ${items}
                </div>
            `;
        }

        // ================================================================
        //  管理员
        // ================================================================
        async function renderAdmin(container) {
            if (!currentUser || currentUser.role !== 'admin') {
                container.innerHTML =
                    `<div class="page active"><div class="empty-state">🔒 需要管理员权限</div></div>`;
                return;
            }
            const stats = await apiCall('/admin/stats');
            const users = await apiCall('/admin/users');

            container.innerHTML = `
                <div class="page active">
                    <h2 style="font-size:1.3rem;margin-bottom:0.8rem;">🛡️ 管理面板</h2>
                    <div class="admin-stats-grid">
                        <div class="stat-card"><span class="stat-number">${stats.users||0}</span><div class="stat-label">用户</div></div>
                        <div class="stat-card"><span class="stat-number">${stats.problems||0}</span><div class="stat-label">题目</div></div>
                        <div class="stat-card"><span class="stat-number">${stats.submissions||0}</span><div class="stat-label">提交</div></div>
                        <div class="stat-card"><span class="stat-number">${stats.openTickets||0}</span><div class="stat-label">工单</div></div>
                    </div>
                    <div class="card">
                        <div class="card-title">👥 用户</div>
                        <div class="table-wrap">
                            <table class="table">
                                <thead><tr><th>用户名</th><th>角色</th><th>已解决</th><th>操作</th></tr></thead>
                                <tbody>
                                    ${users.map(u => `
                                        <tr>
                                            <td>${u.username}</td>
                                            <td>${u.role === 'admin' ? '<span class="admin-tag">管理员</span>' : u.role === 'banned' ? '<span style="color:#ef4444;">封禁</span>' : '用户'}</td>
                                            <td>${(u.solved||[]).length}</td>
                                            <td>${u.role !== 'admin' ? `<button class="btn btn-danger btn-sm" onclick="banUser('${u.id}')">封禁</button>` : ''}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        async function banUser(id) {
            if (!confirm('确认封禁该用户？')) return;
            const res = await apiCall('/admin/users/' + id + '/ban', { method: 'PUT' });
            if (res.error) { showToast(res.error, 'error'); return; }
            showToast('用户已封禁', 'success');
            navigate('admin');
        }

        // ================================================================
        //  启动
        // ================================================================
        window.addEventListener('hashchange', () => {
            const route = getRoute();
            if (route.page === 'problem' && route.param) {
                if (route.param.endsWith('/edit')) {
                    renderProblemEdit(route.param.replace('/edit', ''));
                } else {
                    renderProblemDetail(route.param);
                }
                document.querySelectorAll('.nav-links a').forEach(el => {
                    el.classList.toggle('active', el.id === 'nav-problems');
                });
                return;
            }
            renderPage(route.page, route.param);
            document.querySelectorAll('.nav-links a').forEach(el => {
                el.classList.toggle('active', el.id === 'nav-' + route.page);
            });
        });

        window.addEventListener('load', () => {
            updateUI();
            const route = getRoute();
            if (route.page === 'problem' && route.param) {
                if (route.param.endsWith('/edit')) {
                    renderProblemEdit(route.param.replace('/edit', ''));
                } else {
                    renderProblemDetail(route.param);
                }
                document.querySelectorAll('.nav-links a').forEach(el => {
                    el.classList.toggle('active', el.id === 'nav-problems');
                });
                return;
            }
            navigate(route.page, route.param);
        });

        // 暴露
        window.navigate = navigate;
        window.showLogin = showLogin;
        window.showRegister = showRegister;
        window.switchAuthMode = switchAuthMode;
        window.handleAuth = handleAuth;
        window.logout = logout;
        window.postTweet = postTweet;
        window.showReply = showReply;
        window.submitReply = submitReply;
        window.showReport = showReport;
        window.submitReport = submitReport;
        window.createTeam = createTeam;
        window.joinTeam = joinTeam;
        window.submitTicket = submitTicket;
        window.adminReplyTicket = adminReplyTicket;
        window.replyTicket = replyTicket;
        window.banUser = banUser;
        window.closeModal = closeModal;
        window.filterProblems = filterProblems;
        window.submitCode = submitCode;
        window.loadTemplate = loadTemplate;
        window.resetCode = resetCode;
        window.saveProblemEdit = saveProblemEdit;
        window.deleteProblem = deleteProblem;
        window.renderProblemDetail = renderProblemDetail;
        window.renderProblemEdit = renderProblemEdit;
    </script>
</body>
</html>
