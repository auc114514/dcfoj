<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dan_Chao_Fan OJ - 在线判题系统</title>
    <style>
        /* ===== 全局变量 ===== */
        :root {
            --bg: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --text: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --success: #52c41a;
            --warning: #faad14;
            --danger: #ff4d4f;
            --info: #2f54eb;
            --border: #334155;
            --team-color: #a78bfa;
            --user-color: #fb923c;
            --security: #f472b6;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }
        /* ===== 导航栏 ===== */
        .navbar {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 0 2rem;
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
            flex-wrap: wrap;
        }
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--accent);
            text-decoration: none;
            cursor: pointer;
        }
        .nav-brand::before { content: '⚡'; font-size: 1.8rem; }
        .nav-links {
            display: flex;
            gap: 0.5rem;
            list-style: none;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .nav-links a:hover, .nav-links a.active {
            color: var(--accent);
            background: rgba(56, 189, 248, 0.1);
        }
        .version-badge {
            background: linear-gradient(135deg, var(--accent), var(--info));
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            font-family: 'Courier New', monospace;
            letter-spacing: 0.5px;
        }
        .user-section {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }
        /* ===== 按钮 ===== */
        .btn {
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--info));
            color: white;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(56, 189, 248, 0.4); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
        .btn-secondary:hover { background: var(--bg-tertiary); }
        .btn-danger { background: linear-gradient(135deg, var(--danger), #ff7875); color: white; }
        .btn-success { background: linear-gradient(135deg, var(--success), #22c55e); color: white; }
        .btn-sm { padding: 0.3rem 0.8rem; font-size: 0.8rem; }
        /* ===== 容器 ===== */
        .container { max-width: 1400px; margin: 0 auto; padding: 2rem; }
        /* ===== 页面 ===== */
        .page { display: none; animation: fadeIn 0.3s ease; }
        .page.active { display: block; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* ===== 模态框 ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 2.5rem;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            animation: modalIn 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal h2 { margin-bottom: 1.5rem; text-align: center; }
        .modal .form-group { margin-bottom: 1.25rem; }
        .modal .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
        }
        .modal .form-group input, .modal .form-group textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
            font-family: inherit;
        }
        .modal .form-group input:focus, .modal .form-group textarea:focus {
            border-color: var(--accent);
        }
        .modal .form-hint {
            text-align: center;
            color: var(--text-secondary);
            margin-top: 1rem;
            font-size: 0.9rem;
        }
        .modal .form-hint a {
            color: var(--accent);
            cursor: pointer;
            text-decoration: underline;
        }
        /* ===== Toast ===== */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            padding: 1rem 1.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 3000;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            max-width: 400px;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast-error { border-color: rgba(255,77,79,0.5); color: #ff7875; }
        .toast-success { border-color: rgba(82,196,26,0.5); color: #52c41a; }
        .toast-warning { border-color: rgba(250,173,20,0.5); color: #faad14; }
        /* ===== 滚动条 ===== */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--bg-tertiary); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
        /* ===== 响应式 ===== */
        @media (max-width:768px) {
            .navbar { padding: 0.5rem 1rem; height: auto; gap: 0.5rem; }
            .nav-links a { padding: 0.3rem 0.6rem; font-size: 0.8rem; }
            .container { padding: 1rem; }
            .modal { padding: 1.5rem; margin: 1rem; }
        }
        /* ===== 首页 ===== */
        .hero {
            text-align: center;
            padding: 4rem 2rem;
            background: linear-gradient(135deg, rgba(56,189,248,0.1), rgba(129,140,248,0.1));
            border-radius: 24px;
            margin-bottom: 3rem;
            border: 1px solid rgba(56,189,248,0.2);
        }
        .hero h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--accent), var(--info));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero p { color: var(--text-secondary); font-size: 1.2rem; max-width: 600px; margin: 0 auto 2rem; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }
        .stat-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .stat-card:hover { transform: translateY(-5px); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
        .stat-number { font-size: 2.5rem; font-weight: 800; color: var(--accent); display: block; }
        .stat-label { color: var(--text-secondary); margin-top: 0.5rem; font-size: 0.95rem; }
        .notice-board {
            background: linear-gradient(135deg, rgba(251,191,36,0.1), rgba(251,191,36,0.05));
            border: 1px solid rgba(251,191,36,0.3);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        .notice-title { color: var(--warning); font-weight: 700; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; }
        .footer {
            text-align: center;
            padding: 3rem 2rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--border);
            margin-top: 4rem;
        }
        /* ===== 题库 ===== */
        .problem-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--bg-secondary);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .problem-table th, .problem-table td {
            padding: 1rem 1.5rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        .problem-table th {
            background: rgba(56,189,248,0.1);
            color: var(--accent);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }
        .problem-table tr:hover { background: rgba(56,189,248,0.05); cursor: pointer; }
        .problem-table tr:last-child td { border-bottom: none; }
        .filters {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .filters input, .filters select {
            padding: 0.75rem 1rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            outline: none;
            font-size: 0.95rem;
        }
        .filters input { flex: 1; min-width: 200px; }
        .filters select { min-width: 140px; cursor: pointer; }
        /* ===== 难度颜色 ===== */
        .difficulty {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            letter-spacing: 0.5px;
            border: 1px solid transparent;
        }
        .diff-unrated { background: rgba(156,163,175,0.15); color: #9ca3af; border-color: rgba(156,163,175,0.3); }
        .diff-intro { background: rgba(248,113,113,0.15); color: #f87171; border-color: rgba(248,113,113,0.3); }
        .diff-popular-minus { background: rgba(251,146,60,0.15); color: #fb923c; border-color: rgba(251,146,60,0.3); }
        .diff-popular { background: rgba(250,204,21,0.15); color: #facc15; border-color: rgba(250,204,21,0.3); }
        .diff-popular-plus { background: rgba(74,222,128,0.15); color: #4ade80; border-color: rgba(74,222,128,0.3); }
        .diff-advanced { background: rgba(34,211,238,0.15); color: #22d3ee; border-color: rgba(34,211,238,0.3); }
        .diff-advanced-plus { background: rgba(96,165,250,0.15); color: #60a5fa; border-color: rgba(96,165,250,0.3); }
        .diff-provincial { background: rgba(167,139,250,0.15); color: #a78bfa; border-color: rgba(167,139,250,0.3); }
        .diff-noi { background: rgba(31,41,55,0.9); color: #e5e7eb; border-color: rgba(75,85,99,0.8); }
        .diff-noi-plus { background: rgba(244,114,182,0.15); color: #f472b6; border-color: rgba(244,114,182,0.3); }
        /* ===== 类型标签 ===== */
        .type-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            font-family: 'Courier New', monospace;
            letter-spacing: 0.5px;
        }
        .type-problem { background: rgba(56,189,248,0.2); color: var(--accent); }
        .type-team { background: rgba(167,139,250,0.2); color: var(--team-color); }
        .type-user { background: rgba(251,146,60,0.2); color: var(--user-color); }
        .id-display { font-family: 'Courier New', monospace; font-weight: 700; letter-spacing: 0.5px; }
        .id-problem { color: var(--accent); }
        .id-team { color: var(--team-color); }
        .id-user { color: var(--user-color); }
        .tag {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            background: rgba(56,189,248,0.15);
            color: var(--accent);
            border-radius: 6px;
            font-size: 0.8rem;
            margin-right: 0.5rem;
            font-weight: 500;
        }
        .status-solved { color: var(--success); font-weight: 700; }
        .status-unsolved { color: var(--text-secondary); }
        /* ===== 题目详情 ===== */
        .problem-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            height: calc(100vh - 180px);
        }
        .problem-panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            overflow-y: auto;
        }
        .problem-header {
            border-bottom: 2px solid var(--border);
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }
        .problem-title {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .problem-meta {
            display: flex;
            gap: 1.5rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
            flex-wrap: wrap;
        }
        .problem-meta span { display: flex; align-items: center; gap: 0.5rem; }
        .problem-content h3 { color: var(--accent); margin: 1.5rem 0 0.75rem; font-size: 1.1rem; }
        .problem-content p { margin-bottom: 1rem; line-height: 1.8; }
        .sample-io {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            margin: 1rem 0;
            font-family: 'Courier New', monospace;
        }
        .sample-io .label { color: var(--accent); font-weight: 700; margin-bottom: 0.5rem; display: block; font-size: 0.9rem; }
        .sample-io pre { color: var(--text); white-space: pre-wrap; word-wrap: break-word; margin: 0; font-size: 0.95rem; line-height: 1.5; }
        /* ===== 编辑器 ===== */
        .editor-panel {
            display: flex;
            flex-direction: column;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
        }
        .editor-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .lang-select {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            outline: none;
        }
        .editor-wrapper { flex: 1; position: relative; display: flex; overflow: hidden; }
        .line-numbers {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            padding: 1rem 0.75rem;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            line-height: 1.5;
            text-align: right;
            user-select: none;
            min-width: 50px;
            border-right: 1px solid var(--border);
            overflow: hidden;
        }
        .code-editor {
            flex: 1;
            background: var(--bg);
            color: var(--text);
            border: none;
            padding: 1rem;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            line-height: 1.5;
            resize: none;
            outline: none;
            tab-size: 4;
        }
        .editor-actions {
            display: flex;
            gap: 1rem;
            padding: 1rem 1.5rem;
            background: var(--bg-tertiary);
            border-top: 1px solid var(--border);
            align-items: center;
            flex-wrap: wrap;
        }
        .cooldown-hint {
            color: var(--warning);
            font-size: 0.85rem;
            display: none;
            align-items: center;
            gap: 0.5rem;
        }
        .cooldown-hint.active { display: flex; }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        /* ===== 评测方块 ===== */
        .judge-modal .modal { max-width: 700px; padding: 2rem; }
        .judge-header { text-align: center; margin-bottom: 1.5rem; }
        .judge-icon { font-size: 3rem; margin-bottom: 0.5rem; display: block; }
        .judge-title { font-size: 1.5rem; margin-bottom: 0.5rem; }
        .judge-status-final {
            font-size: 1.1rem;
            font-weight: 700;
            padding: 0.4rem 1.2rem;
            border-radius: 12px;
            display: inline-block;
            margin-top: 0.5rem;
        }
        .testcase-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 0.75rem;
            margin-top: 1rem;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 0.5rem;
        }
        .testcase-block {
            aspect-ratio: 1;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.25rem;
            font-family: 'Courier New', monospace;
            position: relative;
            overflow: hidden;
            border: 2px solid transparent;
            transition: all 0.3s;
            cursor: default;
            min-height: 90px;
        }
        .testcase-block:hover { transform: translateY(-2px); }
        .tc-status { font-size: 1.3rem; font-weight: 800; letter-spacing: 1px; }
        .tc-info { font-size: 0.65rem; opacity: 0.9; text-align: center; line-height: 1.3; }
        .tc-num { position: absolute; top: 4px; left: 6px; font-size: 0.6rem; opacity: 0.7; font-weight: 700; }
        .tc-AC { background: #52c41a; color: white; }
        .tc-WA { background: #ff4d4f; color: white; }
        .tc-TLE { background: #1f1f1f; color: white; border-color: #434343; }
        .tc-RE { background: #722ed1; color: white; }
        .tc-MLE { background: #1f1f1f; color: white; border-color: #434343; }
        .tc-OLE { background: #1f1f1f; color: white; border-color: #434343; }
        .tc-UKE { background: #2f54eb; color: white; }
        .tc-FE { background: #faad14; color: #1f1f1f; }
        .tc-IE { background: #ff4d4f; color: white; }
        .tc-PE { background: #faad14; color: #1f1f1f; }
        .tc-CE { background: #faad14; color: #1f1f1f; }
        .tc-PC { background: #fb923c; color: white; }
        .tc-SE { background: #eb2f96; color: white; }
        .tc-NTD { background: #8c8c8c; color: white; }
        .tc-JF { background: #ff4d4f; color: white; }
        .tc-US { background: #8c8c8c; color: white; }
        .tc-PD { background: #8c8c8c; color: white; }
        .tc-SJE { background: #722ed1; color: white; }
        .tc-OE { background: #faad14; color: #1f1f1f; }
        .tc-CI { background: #1890ff; color: white; }
        .tc-OCP { background: #ff4d4f; color: white; }
        .tc-Judging { background: linear-gradient(135deg, #1890ff, #36cfc9); color: white; animation: judgingPulse 1.5s infinite; }
        .tc-Waiting { background: #8c8c8c; color: white; opacity: 0.6; }
        @keyframes judgingPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(0.97); }
        }
        .progress-bar { width: 100%; height: 6px; background: var(--bg-tertiary); border-radius: 3px; overflow: hidden; margin: 1rem 0; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--info)); border-radius: 3px; transition: width 0.3s ease; width: 0%; }
        /* ===== 提交记录 ===== */
        .submission-filters { display: flex; gap: 0.75rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .filter-btn {
            padding: 0.5rem 1rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }
        .filter-btn:hover, .filter-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
        .empty-state { text-align: center; padding: 4rem 2rem; color: var(--text-secondary); }
        .empty-state-icon { font-size: 4rem; margin-bottom: 1rem; opacity: 0.5; }
        /* ===== 验证码 ===== */
        .captcha-box { display: flex; gap: 1rem; align-items: center; margin-top: 0.5rem; flex-wrap: wrap; }
        .captcha-question {
            background: var(--bg-tertiary);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-weight: 700;
            color: var(--accent);
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
            user-select: none;
        }
        /* ===== 个人主页 ===== */
        .profile-header {
            display: flex;
            gap: 2rem;
            align-items: center;
            padding: 2rem;
            background: var(--bg-secondary);

        .team-card h3 { color: var(--team-color); }
        .team-card .member-count { color: var(--text-secondary); font-size: 0.9rem; }
        .diff-legend { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1rem; }
        .diff-legend-item { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; color: var(--text-secondary); }
        .diff-legend-dot { width: 14px; height: 14px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.1); }
        /* ===== 用户管理 ===== */
        .admin-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        @media (max-width:1024px) {
            .problem-layout { grid-template-columns: 1fr; height: auto; }
            .editor-panel { min-height: 400px; }
            .messages-layout { grid-template-columns: 1fr; height: auto; }

    </style>
</head>

<!-- ===== Toast ===== -->
<div class="toast" id="toast"></div>
<script>
// ================================================================
//  API 配置
// ================================================================
const API_BASE = '/api';

// ================================================================
//  工具函数
// ================================================================
function apiCall(endpoint, options = {}) {
    const token = localStorage.getItem('dcf_token');
    return fetch(API_BASE + endpoint, {
        ...options,
        headers: {
            'Content-Type': 'application/json',
            ...(token ? { 'Authorization': 'Bearer ' + token } : {}),
            ...options.headers
        }
    }).then(r => r.json());
}

function showToast(msg, type) {
    const el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg;
    el.className = 'toast show';
    if (type === 'error') el.classList.add('toast-error');
    else if (type === 'success') el.classList.add('toast-success');
    else if (type === 'warning') el.classList.add('toast-warning');
    clearTimeout(el._timer);
    el._timer = setTimeout(() => { el.classList.remove('show'); }, 3000);
}

// ================================================================
//  用户认证
// ================================================================
let currentUser = null;
let authMode = 'login';

function updateAuthUI() {
    const token = localStorage.getItem('dcf_token');
    const userStr = localStorage.getItem('dcf_user');
    if (token && userStr) {
        try {
            currentUser = JSON.parse(userStr);
            document.getElementById('auth-buttons').style.display = 'none';
            document.getElementById('user-info').style.display = 'flex';
            document.getElementById('username-display').textContent = currentUser.username;
        } catch {
            document.getElementById('auth-buttons').style.display = 'flex';
            document.getElementById('user-info').style.display = 'none';
        }
    } else {
        document.getElementById('auth-buttons').style.display = 'flex';
        document.getElementById('user-info').style.display = 'none';
    }
}

function showAuthModal(mode) {
    authMode = mode || 'login';
    document.getElementById('auth-title').textContent = mode === 'login' ? '登录' : '注册';
    document.getElementById('auth-btn').textContent = mode === 'login' ? '登录' : '注册';
    document.getElementById('auth-hint').innerHTML = mode === 'login' ?
        '还没有账号？<a onclick="switchAuthMode(\'register\')">立即注册</a>' :
        '已有账号？<a onclick="switchAuthMode(\'login\')">去登录</a>';
    document.getElementById('auth-username').value = '';
    document.getElementById('auth-password').value = '';
    document.getElementById('captcha-input').value = '';
    document.getElementById('captcha-group').style.display = 'none';
    document.getElementById('auth-modal').classList.add('active');
    generateCaptcha();
}

function switchAuthMode(mode) { showAuthModal(mode); }
function closeAuthModal() { document.getElementById('auth-modal').classList.remove('active'); }

function generateCaptcha() {
    const a = Math.floor(Math.random() * 20) + 1;
    const b = Math.floor(Math.random() * 20) + 1;
    document.getElementById('captcha-display').textContent = a + ' + ' + b + ' = ?';
    document.getElementById('captcha-display').dataset.answer = String(a + b);
}

async function handleAuth() {
    const username = document.getElementById('auth-username').value.trim();
    const password = document.getElementById('auth-password').value.trim();

    if (!username || !password) { showToast('请填写完整信息', 'warning'); return; }

    // 验证码校验
    const captchaGroup = document.getElementById('captcha-group');
    if (captchaGroup.style.display !== 'none') {
        const input = document.getElementById('captcha-input').value.trim();
        const answer = document.getElementById('captcha-display').dataset.answer;
        if (input !== answer) {
            showToast('验证码错误', 'error');
            generateCaptcha();
            return;
        }
    }

    try {
        const endpoint = authMode === 'login' ? '/auth/login' : '/auth/register';
        const result = await apiCall(endpoint, {
            method: 'POST',
            body: JSON.stringify({ username, password })
        });

        if (result.error) {
            showToast(result.error, 'error');
            if (authMode === 'login') {
                document.getElementById('captcha-group').style.display = 'block';
                generateCaptcha();
            }
            return;
        }

        if (result.token) {
            localStorage.setItem('dcf_token', result.token);
            localStorage.setItem('dcf_user', JSON.stringify(result.user));
            currentUser = result.user;
            closeAuthModal();
            updateAuthUI();
            showToast(authMode === 'login' ? '登录成功！' : '注册成功！', 'success');
            navigate('home');
            renderPage();
        }
    } catch (err) {
        showToast('网络错误', 'error');
    }
}

function logout() {
    localStorage.removeItem('dcf_token');
    localStorage.removeItem('dcf_user');
    currentUser = null;
    updateAuthUI();
    showToast('已退出', 'warning');
    navigate('home');
    renderPage();
}

// ================================================================
//  路由系统
// ================================================================
function navigate(page, param) {
    if (page === 'problem' && param) location.hash = 'problem/' + param;
    else if (page === 'user' && param) location.hash = 'user/' + param;
    else if (page === 'team' && param) location.hash = 'team/' + param;
    else location.hash = page;
}

function getRoute() {
    const hash = location.hash.slice(1) || 'home';
    const parts = hash.split('/');
    return { page: parts[0], param: parts[1] || null };
}

// ================================================================
//  页面渲染
// ================================================================
const DIFFICULTY_CONFIG = {
    unrated: { label: '暂无评定', color: '#9ca3af', class: 'diff-unrated' },
    intro: { label: '入门', color: '#f87171', class: 'diff-intro' },
    'popular-minus': { label: '普及-', color: '#fb923c', class: 'diff-popular-minus' },
    popular: { label: '普及', color: '#facc15', class: 'diff-popular' },
    'popular-plus': { label: '普及+/提高-', color: '#4ade80', class: 'diff-popular-plus' },
    advanced: { label: '提高', color: '#22d3ee', class: 'diff-advanced' },
    'advanced-plus': { label: '提高+/省选-', color: '#60a5fa', class: 'diff-advanced-plus' },
    provincial: { label: '省选/NOI-', color: '#a78bfa', class: 'diff-provincial' },
    noi: { label: 'NOI', color: '#e5e7eb', class: 'diff-noi' },
    'noi-plus': { label: 'NOI+/CTS/CTT/IOI', color: '#f472b6', class: 'diff-noi-plus' }
};
const DIFFICULTY_ORDER = ['unrated', 'intro', 'popular-minus', 'popular', 'popular-plus',
    'advanced', 'advanced-plus', 'provincial', 'noi', 'noi-plus'
];

const TYPE_CONFIG = {
    problem: { label: '题库题', badgeClass: 'type-problem', idClass: 'id-problem' },
    team: { label: '团队题', badgeClass: 'type-team', idClass: 'id-team' },
    user: { label: '用户独创', badgeClass: 'type-user', idClass: 'id-user' }
};

const STATUS_LABELS = {
    AC: 'AC', WA: 'WA', TLE: 'TLE', RE: 'RE', MLE: 'MLE', OLE: 'OLE',
    UKE: 'UKE', FE: 'FE', IE: 'IE', PE: 'PE', CE: 'CE', PC: 'PC',
    SE: 'SE', NTD: 'NTD', JF: 'JF', US: 'US', PD: 'PD', SJE: 'SJE',
    OE: 'OE', CI: 'CI', OCP: 'OCP', Judging: 'Judging', Waiting: 'Waiting'
};

function renderPage() {
    const route = getRoute();
    const page = route.page;
    const param = route.param;
    const app = document.getElementById('app');

    // 导航高亮
    document.querySelectorAll('.nav-links a').forEach(el => el.classList.remove('active'));
    const navMap = {
        home: 'nav-home', problems: 'nav-problems', submissions: 'nav-submissions',
        messages: 'nav-messages', notifications: 'nav-notifications',
        teams: 'nav-teams', users: 'nav-users', about: 'nav-about'
    };
    if (navMap[page]) document.getElementById(navMap[page]).classList.add('active');

    switch (page) {
        case 'home': renderHome(app); break;
        case 'problems': renderProblems(app); break;
        case 'problem': case 'user': renderProblemDetail(app, param); break;
        case 'submissions': renderSubmissions(app); break;
        case 'profile': renderProfile(app); break;
        case 'messages': renderMessages(app); break;
        case 'notifications': renderNotifications(app); break;
        case 'teams': renderTeams(app); break;
        case 'users': renderUsers(app); break;
        case 'about': renderAbout(app); break;
        default: renderHome(app);
    }
}

// ===== 首页 =====
async function renderHome(container) {
    const problems = await apiCall('/problems');
    const subs = await apiCall('/submissions');
    const ac = subs.filter(s => s.status === 'AC').length;
    const rate = subs.length ? Math.floor(ac / subs.length * 100) : 0;

    let legend = DIFFICULTY_ORDER.map(k => {
        const c = DIFFICULTY_CONFIG[k];
        return `<div class="diff-legend-item"><div class="diff-legend-dot" style="background:${c.color};"></div><span>${c.label}</span></div>`;
    }).join('');

    container.innerHTML = `<div class="page active">
        <div class="hero">
            <h1>Dan_Chao_Fan OJ</h1>
            <p>自主判题 · 实时评测 · 21种状态 · 安全防护</p>
            <button class="btn btn-primary" onclick="navigate('problems')"><span>🚀</span> 开始做题</button>
        </div>
        <div class="notice-board">
            <div class="notice-title">📢 系统公告</div>
            <p style="color:var(--text-secondary);">Dan_Chao_Fan OJ v1.0.0 支持 21 种评测状态。P 题库题 · T 团队题 · U 用户独创。</p>
            <div class="diff-legend">${legend}</div>
        </div>
        <div class="stats-grid">
            <div class="stat-card"><span class="stat-number">${problems.length}</span><div class="stat-label">题目总数</div></div>
            <div class="stat-card"><span class="stat-number">${subs.length}</span><div class="stat-label">总提交</div></div>
            <div class="stat-card"><span class="stat-number">${ac}</span><div class="stat-label">通过数量</div></div>
            <div class="stat-card"><span class="stat-number">${rate}%</span><div class="stat-label">通过率</div></div>
        </div>
    </div>`;
}

// ===== 题库 =====
async function renderProblems(container) {
    let diffOpts = DIFFICULTY_ORDER.map(k =>
        `<option value="${k}">${DIFFICULTY_CONFIG[k].label}</option>`
    ).join('');

    container.innerHTML = `<div class="page active">
        <h2 style="margin-bottom:1.5rem;font-size:1.8rem;">📚 题目列表</h2>
        <div class="filters">
            <input type="text" id="problem-search" placeholder="搜索题号或题目..." oninput="renderProblemList()" />
            <select id="difficulty-filter" onchange="renderProblemList()"><option value="all">全部难度</option>${diffOpts}</select>
            <select id="type-filter" onchange="renderProblemList()"><option value="all">全部类型</option><option value="problem">📘 题库题</option><option value="team">👥 团队题</option><option value="user">✨ 用户独创</option></select>
        </div>
        <table class="problem-table">
            <thead><tr><th style="width:60px;">状态</th><th style="width:110px;">题号</th><th>题目名称</th><th style="width:100px;">类型</th><th style="width:140px;">难度</th><th style="width:90px;">通过率</th><th>标签</th></tr></thead>
            <tbody id="problem-list-body"></tbody>
        </table>
    </div>`;
    renderProblemList();
}

async function renderProblemList() {
    const problems = await apiCall('/problems');
    const solved = currentUser?.solved || [];
    const subs = await apiCall('/submissions');
    const search = (document.getElementById('problem-search')?.value || '').toLowerCase();
    const diffFilter = document.getElementById('difficulty-filter')?.value || 'all';
    const typeFilter = document.getElementById('type-filter')?.value || 'all';

    let filtered = problems.filter(p => {
        const ms = p.title.toLowerCase().includes(search) || p.code.toLowerCase().includes(search) ||
            p.tags?.some(t => t.includes(search));
        const md = diffFilter === 'all' || p.difficulty === diffFilter;
        const mt = typeFilter === 'all' || p.type === typeFilter;
        return ms && md && mt;
    });

    const tbody = document.getElementById('problem-list-body');
    if (!tbody) return;

    tbody.innerHTML = filtered.map(p => {
        const isSolved = solved.includes(p.code);
        const dc = DIFFICULTY_CONFIG[p.difficulty] || DIFFICULTY_CONFIG.unrated;
        const tc = TYPE_CONFIG[p.type] || TYPE_CONFIG.problem;
        const ps = subs.filter(s => s.problemCode === p.code);
        const ac = ps.filter(s => s.status === 'AC').length;
        const rate = ps.length ? Math.floor(ac / ps.length * 100) : 0;
        const link = p.type === 'user' ? `navigate('user','${p.code}')` :
            `navigate('problem','${p.code}')`;

function loadTemplate() {
    const lang = document.getElementById('code-lang')?.value || 'cpp';
    const templates = {
        cpp: '// 请在此编写你的 C++ 代码\n#include <iostream>\nusing namespace std;\n\nint main() {\n    // TODO: 编写你的代码\n    return 0;\n}',
        python: '# 请在此编写你的 Python 代码\n# TODO: 编写你的代码',
        java: '// 请在此编写你的 Java 代码\nimport java.util.Scanner;\n\npublic class Main {\n    public static void main(String[] args) {\n        // TODO: 编写你的代码\n    }\n}'
    };
    document.getElementById('code-editor').value = templates[lang] || '';
    updateLineNumbers();
}

function setupEditor() {
    const ed = document.getElementById('code-editor');
    const ln = document.getElementById('line-numbers');
    if (!ed) return;
    ed.addEventListener('input', updateLineNumbers);
    ed.addEventListener('scroll', () => { ln.scrollTop = ed.scrollTop; });
    ed.addEventListener('keydown', (e) => {
        if (e.key === 'Tab') {
            e.preventDefault();
            const s = ed.selectionStart, end = ed.selectionEnd;
            ed.value = ed.value.substring(0, s) + '    ' + ed.value.substring(end);
            ed.selectionStart = ed.selectionEnd = s + 4;
            updateLineNumbers();
        }
    });
}

function updateLineNumbers() {
    const ed = document.getElementById('code-editor');
    const ln = document.getElementById('line-numbers');
    if (!ed || !ln) return;
    ln.innerHTML = Array.from({ length: ed.value.split('\n').length }, (_, i) => i + 1).join('<br>');
}

function resetCode() { loadTemplate(); }

let currentChatUser = null;

function loadConversation(username) {
    currentChatUser = username;
    document.querySelectorAll('.conversation-item').forEach(el =>
        el.classList.toggle('active', el.dataset.user === username));
    renderChatMessages(username);
}

function renderChatMessages(username) {
    const container = document.getElementById('chat-messages');
    if (!container) return;
    const msgs = JSON.parse(localStorage.getItem('dcf_messages') || '[]')
        .filter(m => (m.from === currentUser.username && m.to === username) || (m.from === username && m.to === currentUser.username));
    if (!msgs.length) { container.innerHTML = `<div style="color:var(--text-secondary);text-align:center;padding:2rem;">和 ${username} 聊天</div>`; return; }
    container.innerHTML = msgs.map(m =>
        `<div class="chat-msg ${m.from===currentUser.username?'sent':'received'}"><div>${m.content}</div><div style="font-size:0.7rem;opacity:0.7;margin-top:0.25rem;">${m.time}</div></div>`
    ).join('');
    container.scrollTop = container.scrollHeight;
}

function sendMessage() {
    const input = document.getElementById('chat-input');
    const content = input.value.trim();
    if (!content || !currentChatUser) return;
    const msgs = JSON.parse(localStorage.getItem('dcf_messages') || '[]');
    msgs.push({ from: currentUser.username, to: currentChatUser, content, time: new Date().toLocaleString('zh-CN') });
    localStorage.setItem('dcf_messages', JSON.stringify(msgs));
    input.value = '';
    renderChatMessages(currentChatUser);
    document.querySelectorAll('.conversation-item').forEach(el => {
        if (el.dataset.user === currentChatUser) el.querySelector('.last-msg').textContent = content;
    });
}

function preSubmitCheck() {
    if (!currentUser) { showToast('请先登录', 'warning'); return; }
    const code = document.getElementById('code-editor')?.value.trim();
    if (!code || code.length < 5) { showToast('代码太短', 'warning'); return; }
    // 显示验证码
    const a = Math.floor(Math.random() * 20) + 1, b = Math.floor(Math.random() * 20) + 1;
    document.getElementById('submit-captcha-display').textContent = a + ' + ' + b + ' = ?';
    document.getElementById('submit-captcha-display').dataset.answer = String(a + b);
    document.getElementById('submit-captcha-input').value = '';
    document.getElementById('captcha-modal').classList.add('active');
}

function closeCaptchaModal() { document.getElementById('captcha-modal').classList.remove('active'); }

async function verifySubmitCaptcha() {
    const input = document.getElementById('submit-captcha-input').value.trim();
    const answer = document.getElementById('submit-captcha-display').dataset.answer;
    if (input !== answer) {
        showToast('验证码错误', 'error');
        const a = Math.floor(Math.random() * 20) + 1, b = Math.floor(Math.random() * 20) + 1;
        document.getElementById('submit-captcha-display').textContent = a + ' + ' + b + ' = ?';
        document.getElementById('submit-captcha-display').dataset.answer = String(a + b);
        document.getElementById('submit-captcha-input').value = '';
        return;
    }
    closeCaptchaModal();
    executeSubmit();
}

async function executeSubmit() {
    const code = document.getElementById('code-editor').value.trim();
    const lang = document.getElementById('code-lang').value;

    try {
        const result = await apiCall('/submissions', {
            method: 'POST',
            body: JSON.stringify({
                problemCode: currentProblemCode,
                code: code,
                lang: lang
            })
        });

        if (result.error) { showToast(result.error, 'error'); return; }

        // 模拟判题过程
        const modal = document.getElementById('judge-modal');
        const progress = document.getElementById('judge-progress');
        const icon = document.getElementById('judge-icon');
        const title = document.getElementById('judge-title');
        const status = document.getElementById('judge-status');
        const info = document.getElementById('judge-info');
        const grid = document.getElementById('testcase-grid');
        const closeBtn = document.getElementById('judge-close-btn');

        modal.classList.add('active');
        progress.style.width = '0%';
        icon.textContent = '⏳';
        title.textContent = '正在评测...';
        status.style.display = 'none';
        info.textContent = '正在编译代码...';
        closeBtn.style.display = 'none';
        grid.innerHTML = '';

        // 获取题目测试用例
        const problems = await apiCall('/problems');
        const p = problems.find(x => x.code === currentProblemCode);
        const testCases = p?.testCases || [];

        const allStatuses = ['AC', 'WA', 'TLE', 'RE', 'MLE', 'OLE', 'UKE', 'FE', 'IE',
            'PE', 'CE', 'PC', 'SE', 'NTD', 'JF', 'US', 'PD', 'SJE', 'OE', 'CI', 'OCP'
        ];
        const statusIcons = {
            AC: '✅', WA: '❌', TLE: '⏰', RE: '💥', MLE: '💾', OLE: '📤',
            UKE: '❓', FE: '⚠️', IE: '⚠️', PE: '⚠️', CE: '🔧', PC: '🔶',
            SE: '💔', NTD: '⏸️', JF: '❌', US: '🚫', PD: '⏳', SJE: '⚡',
            OE: '⚠️', CI: '🔵', OCP: '🚫'
        };
        const statusLabels = {
            AC: 'AC', WA: 'WA', TLE: 'TLE', RE: 'RE', MLE: 'MLE', OLE: 'OLE',
            UKE: 'UKE', FE: 'FE', IE: 'IE', PE: 'PE', CE: 'CE', PC: 'PC',
            SE: 'SE', NTD: 'NTD', JF: 'JF', US: 'US', PD: 'PD', SJE: 'SJE',
            OE: 'OE', CI: 'CI', OCP: 'OCP'
        };

        const blocks = [];
        testCases.forEach((tc, i) => {
            const b = document.createElement('div');
            b.className = 'testcase-block tc-Waiting';
            b.id = 'tc-' + i;
            b.innerHTML = `<div class="tc-num">#${i+1}</div><div class="tc-status">⏳</div><div class="tc-info">等待</div>`;
            grid.appendChild(b);
            blocks.push(b);
        });

        let finalStatus = 'AC';
        let totalTime = 0,
            maxMemory = 0;

        setTimeout(() => { progress.style.width = '10%'; info.textContent = '编译中...'; }, 300);
        setTimeout(() => { progress.style.width = '25%'; info.textContent = '编译成功，开始评测...'; }, 800);

        let idx = 0;

        function runNext() {
            if (idx >= testCases.length) { finish(); return; }
            const block = blocks[idx];
            block.className = 'testcase-block tc-Judging';
            block.querySelector('.tc-status').textContent = '⚡';
            block.querySelector('.tc-info').textContent = '评测中';

            setTimeout(() => {
                const statusIdx = Math.floor(Math.random() * allStatuses.length);
                const actualStatus = idx < testCases.length * 0.4 && Math.random() > 0.3 ? 'AC' : allStatuses[statusIdx];

                if (actualStatus !== 'AC' && finalStatus === 'AC') finalStatus = actualStatus;
                totalTime += Math.floor(Math.random() * 80 + 10);
                maxMemory = Math.max(maxMemory, Math.floor(Math.random() * 20 + 2));

                block.className = `testcase-block tc-${actualStatus}`;
                block.querySelector('.tc-status').textContent = statusIcons[actualStatus] || '❓';
                block.querySelector('.tc-info').textContent = statusLabels[actualStatus] || actualStatus;

                const pct = 25 + ((idx + 1) / testCases.length) * 70;
                progress.style.width = pct + '%';
                info.textContent = `测试点 #${idx+1} ${actualStatus === 'AC' ? '通过' : actualStatus}`;

                idx++;
                setTimeout(runNext, 300 + Math.random() * 300);
            }, 400 + Math.random() * 400);
        }

        function finish() {
            progress.style.width = '100%';
            const sm = {
                AC: { icon: '✅', text: 'Accepted', cls: 'status-AC' },
                WA: { icon: '❌', text: 'Wrong Answer', cls: 'status-WA' },
                TLE: { icon: '⏰', text: 'Time Limit Exceeded', cls: 'status-TLE' },
                RE: { icon: '💥', text: 'Runtime Error', cls: 'status-RE' },
                MLE: { icon: '💾', text: 'Memory Limit Exceeded', cls: 'status-MLE' },
                OLE: { icon: '📤', text: 'Output Limit Exceeded', cls: 'status-OLE' },
                CE: { icon: '🔧', text: 'Compile Error', cls: 'status-CE' },
                UKE: { icon: '❓', text: 'Unknown Error', cls: 'status-UKE' },
                FE: { icon: '⚠️', text: 'Format Error', cls: 'status-FE' },
                IE: { icon: '⚠️', text: 'Internal Error', cls: 'status-IE' },
                PE: { icon: '⚠️', text: 'Presentation Error', cls: 'status-PE' },
                PC: { icon: '🔶', text: 'Partially Correct', cls: 'status-PC' },
                SE: { icon: '💔', text: 'System Error', cls: 'status-SE' },
                NTD: { icon: '⏸️', text: 'Not Tested', cls: 'status-NTD' },
                JF: { icon: '❌', text: 'Judging Failed', cls: 'status-JF' },
                US: { icon: '🚫', text: 'Unsupported', cls: 'status-US' },
                PD: { icon: '⏳', text: 'Pending', cls: 'status-PD' },
                SJE: { icon: '⚡', text: 'Special Judge Error', cls: 'status-SJE' },
                OE: { icon: '⚠️', text: 'Output Error', cls: 'status-OE' },
                CI: { icon: '🔵', text: 'Compiling', cls: 'status-CI' },
                OCP: { icon: '🚫', text: 'Out of Content Policy', cls: 'status-OCP' }
            };
            const s = sm[finalStatus] || sm.AC;
            icon.textContent = s.icon;
            title.textContent = '评测完成';
            status.textContent = s.text;
            status.className = `judge-status-final ${s.cls}`;
            status.style.display = 'inline-block';
            info.textContent = `总耗时: ${totalTime} ms | 峰值内存: ${maxMemory} MB | 语言: ${lang.toUpperCase()}`;
            closeBtn.style.display = 'inline-flex';

            // 刷新提交记录
            renderSubmissionList();
        }

        runNext();

    } catch (err) {
        showToast('提交失败', 'error');
    }
}

function closeJudgeModal() {
    document.getElementById('judge-modal').classList.remove('active');
}
