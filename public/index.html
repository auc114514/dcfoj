<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dan_Chao_Fan OJ - v1.2.0</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
</head>
<body>

    <nav class="navbar">
        <span class="nav-brand" onclick="navigate('home')">Dan_Chao_Fan OJ</span>
        <div class="nav-top-right">
            <span class="version-badge">v1.2.0</span>
            <span id="user-status" style="color:#94a3b8;font-size:0.8rem;">🧑 Guest</span>
            <span id="gu-display-header"></span>
            <div id="auth-btns">
                <button class="btn btn-secondary btn-sm" onclick="showLogin()">登录</button>
                <button class="btn btn-primary btn-sm" onclick="showRegister()">注册</button>
            </div>
            <button class="btn btn-secondary btn-sm" id="logout-btn" style="display:none;" onclick="logout()">退出</button>
            <button class="btn btn-secondary btn-sm" onclick="toggleSidebar()">☰</button>
        </div>
    </nav>

    <div class="app-layout">
        <div class="sidebar" id="sidebar">
            <div class="user-profile-mini" id="sidebar-user">
                <div class="avatar" id="sidebar-avatar">G</div>
                <div>
                    <div class="uname" id="sidebar-uname" onclick="navigate('home')">Guest</div>
                    <div class="urole" id="sidebar-urole">游客</div>
                </div>
            </div>
            <div class="nav-section">
                <div class="section-title">导航</div>
                <div class="nav-item active" onclick="navigate('home')" data-page="home"><span class="icon">🏠</span> 首页</div>
                <div class="nav-item" onclick="navigate('problems')" data-page="problems"><span class="icon">📚</span> 题库</div>
                <div class="nav-item" onclick="navigate('submissions')" data-page="submissions"><span class="icon">📋</span> 提交</div>
                <div class="nav-item" onclick="navigate('tweets')" data-page="tweets"><span class="icon">🐮</span> 犇犇</div>
            </div>
            <div class="nav-divider"></div>
            <div class="nav-section">
                <div class="section-title">社区</div>
                <div class="nav-item" onclick="navigate('teams')" data-page="teams"><span class="icon">👥</span> 团队</div>
                <div class="nav-item" onclick="navigate('tickets')" data-page="tickets"><span class="icon">📩</span> 工单</div>
                <div class="nav-item" onclick="navigate('logs')" data-page="logs" style="color:#f472b6;"><span class="icon">📜</span> 陶片</div>
            </div>
            <div class="nav-divider"></div>
            <div class="nav-section">
                <div class="section-title">系统</div>
                <div class="nav-item" onclick="navigate('versions')" data-page="versions"><span class="icon">📌</span> 版本</div>
                <div class="nav-item" id="nav-admin-item" onclick="navigate('admin')" data-page="admin" style="display:none;color:#8b5cf6;"><span class="icon">🛡️</span> 管理</div>
            </div>
        </div>
        <div class="main-content" id="app"></div>
    </div>

    <footer class="footer"><p>Dan_Chao_Fan OJ v1.2.0 | 咕值 · 犇犇 · 团队 · 工单 · 陶片 · UID · LaTeX</p></footer>

    <!-- 模态框 -->
    <div class="modal-overlay" id="login-modal">...</div>
    <div class="modal-overlay" id="tweet-modal">...</div>
    <div class="modal-overlay" id="reply-modal">...</div>
    <div class="modal-overlay" id="report-modal">...</div>
    <div class="modal-overlay" id="team-modal">...</div>
    <div class="modal-overlay" id="ticket-modal">...</div>
    <div class="modal-overlay" id="admin-ticket-modal">...</div>
    <div class="modal-overlay" id="judge-modal">...</div>
    <div class="modal-overlay" id="role-modal">...</div>
    <div class="modal-overlay" id="revoke-modal">...</div>

    <script>
        const API = '/api';
        let currentUser = null;
        let currentPage = 'home';
        let authMode = 'login';
        let replyTargetId = null;
        let reportTargetId = null;
        let currentTicketId = null;
        let currentProblemCode = null;
        let roleTargetUserId = null;
        let revokeTargetUserId = null;
    </script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/router.js"></script>
    <script src="/js/pages/home.js"></script>
    <script src="/js/pages/problems.js"></script>
    <script src="/js/pages/submissions.js"></script>
    <script src="/js/pages/tweets.js"></script>
    <script src="/js/pages/user.js"></script>
    <script src="/js/pages/teams.js"></script>
    <script src="/js/pages/tickets.js"></script>
    <script src="/js/pages/admin.js"></script>
    <script src="/js/pages/logs.js"></script>
    <script src="/js/pages/versions.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
